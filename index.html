<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFE" />
    <meta name="description" content="서울 동네 축제·전통시장·꽃길·산책로·둘레길·박물관 안내 — 외국인 관광객을 위한 서비스(가제)" />

    <!-- iOS Safari는 web manifest를 완전히 따르지 않아 애플 전용 태그를 따로 둔다 -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="K-Street" />

    <!-- 🔗 링크를 붙였을 때 뜨는 **미리보기 카드** (2026-09-04 홍보 준비).
         이게 없으면 카톡·트위터·레딧·문자에 주소를 붙여도 **아무 그림도 안 뜨고**
         밋밋한 글자 한 줄만 남는다 — 그런 링크는 아무도 안 누른다.

         🚨 og:image·og:url은 **절대 주소**여야 한다. 크롤러는 우리 페이지를 안 열고
            이 태그만 읽어 가므로 '/…' 같은 상대 주소는 못 따라온다.
            → **주소가 또 바뀌면 아래 두 줄을 같이 고칠 것.**

         그림은 scripts/make-share-card.mjs가 만든다 — 이름이 바뀌면 그 파일의
         CARD만 고쳐 다시 돌리면 된다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="K-Street" />
    <meta property="og:title" content="K-Street — Seoul, street by street" />
    <meta
      property="og:description"
      content="Neighborhood festivals, traditional markets, flower walks, trails and museums across Seoul's 25 districts. Free forever, no sign-up, 12 languages."
    />
    <meta property="og:url" content="https://korea-street.com/" />
    <meta property="og:image" content="https://korea-street.com/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="K-Street — Seoul, street by street" />
    <meta property="og:locale" content="en_US" />
    <!-- 트위터/X는 og를 대부분 따라 읽지만, 큰 그림으로 뜨게 하려면 이 줄이 필요하다. -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 🌏 글꼴은 **화면을 막지 않고** 받는다 (2026-09-04 출시 전 검수).
         media="print"로 걸어 두면 브라우저가 "인쇄용이라 지금은 안 쓴다"고 보고
         화면 그리기를 멈추지 않는다. 다 받아진 순간 onload가 media를 all로 바꿔
         그때부터 적용된다. 구글 글꼴 서버가 느리거나 막힌 곳(중국에서는 구글이
         막혀 있다)에서도 첫 화면이 제때 뜬다 — 글꼴이 안 와도 index.css에 적어 둔
         대체 서체로 읽힌다. 자바스크립트를 끈 브라우저를 위해 noscript로 한 번 더 둔다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      />
    </noscript>

    <!-- 🔎 네이버 서치어드바이저 **소유확인** (2026-09-05).
         네이버가 이 줄을 읽어 "이 사이트 주인이 맞다"고 판정한다.
         🚨 **지우면 안 된다.** 확인이 풀리면 네이버 검색에서 우리가 빠지고,
            사이트맵도 다시 못 넣는다. 구글 쪽은 public/google….html 파일이 같은 일을 한다.
         한국 안에서는 이쪽이 구글보다 더 중요하다 — 국내 검색은 네이버 몫이 크다. -->
    <meta name="naver-site-verification" content="325ddc2330e0cb37de4aafbdd804563e5d61c2b7" />

    <title>K-Street</title>
    <script>
      window.__CONFIG__ = {
        VITE_NAVER_MAPS_CLIENT_ID: "lj1zdhk3ep"
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
