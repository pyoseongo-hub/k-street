<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F8FAFE" />
    <!-- 🔎 **구글 검색 결과에 그대로 뜨는 두 줄**이 제목(<title>)과 이 설명이다
         (2026-09-09 정리). 고치기 전에는 이랬다:
           · 제목 = 「K-Street」 — 이름만 있고 **무엇을 하는 곳인지가 없었다.**
             「Seoul festivals」로 찾는 사람에게 걸릴 낱말이 한 개도 없다.
           · 설명 = 한국어 + 끝에 **"(가제)"**. 손님은 한국어를 못 읽고,
             "(가제)"는 아직 만드는 중이라는 뜻이라 눌러 볼 마음을 없앤다.
         손님이 실제로 치는 말(festivals · markets · Seoul)을 넣되
         **없는 것을 지어내지 않는다** — 아래 숫자·말은 전부 실제 그대로다. -->
    <meta
      name="description"
      content="Free guide to Seoul's neighbourhoods: festivals by month, traditional markets, flower walks, hiking trails and museums across all 25 districts. KakaoMap and Naver Map directions, Korean names to show a taxi driver. 12 languages, no sign-up."
    />

    <!-- 🖼️ **검색 결과에 사진을 크게 띄우라고 허락하는 줄** (2026-09-11).
         이 줄이 없으면 구글은 사진을 엄지손톱만 하게 띄우거나 아예 안 띄운다 —
         기본값이 그렇다. 허락한 적이 없으니 조심스럽게 구는 것이다.
         **구글 디스커버**(안드로이드 크롬 첫 화면에 뜨는 추천 글)는 큰 사진이
         없으면 아예 후보에 안 넣는다. 손님이 「서울 축제」를 검색하지 않아도
         우리 글이 먼저 찾아갈 수 있는 **유일한 길**이라 비워 둘 자리가 아니다.
         🚨 여기에 noindex 를 넣으면 첫 화면이 검색에서 통째로 사라진다.
            같은 줄을 곳·묶음 4,225장에도 넣었다(scripts/build-place-pages.ts 의 ROBOTS). -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />

    <!-- iOS Safari는 web manifest를 완전히 따르지 않아 애플 전용 태그를 따로 둔다 -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="K-Street" />

    <!-- 🔗 링크를 붙였을 때 뜨는 **미리보기 카드** (2026-09-04 홍보 준비).
         이게 없으면 카톡·트위터·레딧·문자에 주소를 붙여도 **아무 그림도 안 뜨고**
         밋밋한 글자 한 줄만 남는다 — 그런 링크는 아무도 안 누른다.

         🚨 og:image·og:url은 **절대 주소**여야 한다. 크롤러는 우리 페이지를 안 열고
            이 태그만 읽어 가므로 '/…' 같은 상대 주소는 못 따라온다.
            → **주소가 또 바뀌면 아래 두 줄을 같이 고칠 것.**

         그림은 scripts/make-share-card.mjs가 만든다 — 이름이 바뀌면 그 파일의
         CARD만 고쳐 다시 돌리면 된다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="K-Street" />
    <meta property="og:title" content="K-Street — Seoul, street by street" />
    <meta
      property="og:description"
      content="Neighborhood festivals, traditional markets, flower walks, trails and museums across Seoul's 25 districts. Free forever, no sign-up, 12 languages."
    />
    <meta property="og:url" content="https://korea-street.com/" />
    <meta property="og:image" content="https://korea-street.com/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="K-Street — Seoul, street by street" />
    <meta property="og:locale" content="en_US" />
    <!-- 트위터/X는 og를 대부분 따라 읽지만, 큰 그림으로 뜨게 하려면 이 줄이 필요하다. -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- 🌏 글꼴은 **화면을 막지 않고** 받는다 (2026-09-04 출시 전 검수).
         media="print"로 걸어 두면 브라우저가 "인쇄용이라 지금은 안 쓴다"고 보고
         화면 그리기를 멈추지 않는다. 다 받아진 순간 onload가 media를 all로 바꿔
         그때부터 적용된다. 구글 글꼴 서버가 느리거나 막힌 곳(중국에서는 구글이
         막혀 있다)에서도 첫 화면이 제때 뜬다 — 글꼴이 안 와도 index.css에 적어 둔
         대체 서체로 읽힌다. 자바스크립트를 끈 브라우저를 위해 noscript로 한 번 더 둔다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+KR:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      />
    </noscript>

    <!-- 🔎 네이버 서치어드바이저 **소유확인** (2026-09-05).
         네이버가 이 줄을 읽어 "이 사이트 주인이 맞다"고 판정한다.
         🚨 **지우면 안 된다.** 확인이 풀리면 네이버 검색에서 우리가 빠지고,
            사이트맵도 다시 못 넣는다. 구글 쪽은 public/google….html 파일이 같은 일을 한다.
         한국 안에서는 이쪽이 구글보다 더 중요하다 — 국내 검색은 네이버 몫이 크다. -->
    <meta name="naver-site-verification" content="325ddc2330e0cb37de4aafbdd804563e5d61c2b7" />

    <title>K-Street — Seoul festivals, markets and walks, district by district</title>

    <!-- 🏷️ **사이트가 무엇인지** 구글에게 한 번 말해 주는 줄 (2026-09-11).
         낱장(곳·묶음 페이지)에는 진작 구조화 자료를 넣었는데 **첫 화면에는 없었다.**
         구글이 "이 주소들이 한 사이트다"라고 묶을 근거가 그동안 없었다.
         🚨 화면에 실제로 있는 것만 적는다 — 없는 기능을 지어내지 않는다.
            SearchAction(검색창)은 **안 넣는다.** 이 앱에는 주소로 검색하는 화면이 없다. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "K-Street",
        "url": "https://korea-street.com/",
        "description": "Free guide to Seoul's neighbourhoods: festivals by month, traditional markets, flower walks, hiking trails and museums across all 25 districts. 12 languages, no sign-up.",
        "inLanguage": ["en", "ko", "ja", "zh", "zh-TW", "vi", "th", "id", "es", "fr", "de", "ru"],
        "isAccessibleForFree": true
      }
    </script>

    <script>
      window.__CONFIG__ = {
        VITE_NAVER_MAPS_CLIENT_ID: "lj1zdhk3ep"
      };
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- 🗂️ 자바스크립트가 없을 때 보이는 문 (2026-09-08).
         이 앱은 화면을 전부 자바스크립트로 그려서, 자바스크립트를 못 돌리는 쪽에는
         **첫 화면이 빈 종이**다. AI 크롤러(GPTBot·ClaudeBot·Perplexity)가 바로
         그렇다 — robots.txt 로 환영해 놓고 정작 볼 것을 안 준 셈이었다.
         그래서 묶음 페이지(/seoul/…)로 가는 길을 여기에 둔다. 사람에게도 쓸모가
         있다: 자바스크립트를 꺼 둔 브라우저에서도 목록을 볼 수 있다.
         ⚠️ 화면에 보이는 것과 다른 말을 넣지 않는다 — 숨긴 글은 검색에서 벌점이다. -->
    <noscript>
      <p>K-Street — a free, no-sign-up guide to Seoul's neighbourhoods in 12 languages.</p>
      <ul>
        <li><a href="/seoul/">All of Seoul — by district, month and kind</a></li>
        <li><a href="/seoul/festivals/">Festivals in Seoul</a></li>
        <li><a href="/seoul/traditional-markets/">Traditional markets in Seoul</a></li>
        <li><a href="/seoul/walking-paths/">Walking paths in Seoul</a></li>
        <li><a href="/seoul/hiking-trails/">Hiking trails in Seoul</a></li>
        <li><a href="/seoul/museums/">Museums in Seoul</a></li>
      </ul>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
