name: Check DNS (도메인이 GitHub을 가리키나)

# 📡 도메인이 GitHub 쪽을 제대로 가리키는지 본다. 아무것도 저장하지 않는다.
#
# 가비아에서 DNS를 저장해도 인터넷 전체에 퍼지는 데 10분~1시간이 걸린다.
# 그전에 GitHub에 도메인을 적으면 지금 잘 되는 사이트가 통째로 안 열린다.
# "이제 해도 되는 때"를 감으로 찍지 않으려고 만들었다.

on:
  workflow_dispatch:
    inputs:
      domain:
        description: "확인할 도메인"
        type: string
        default: "korea-street.com"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: DNS 확인
        env:
          DOMAIN: ${{ inputs.domain }}
        run: |
          set -o pipefail
          node scripts/check-dns.mjs 2>&1 | tee dns-log.txt
      - name: 결과 요약 (Summary에서 바로 확인)
        if: always()
        run: |
          {
            echo "## 📡 DNS 확인 결과"
            echo ""
            echo '```'
            cat dns-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
