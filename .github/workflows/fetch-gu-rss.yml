name: Fetch gu RSS (구청 RSS 주소 받기)

# 📡 **25개 구청의 RSS 주소를 서울시에서 받아 적는다.**
#    사장님 결정(2026-10-08): 구청 메일 25번 신청 대신 RSS 로 간다.
#    메일을 보내 주는 구는 **6곳뿐**이었다(docs/구청-메일-소식지.md).
#
#    이것은 **주소 목록을 만드는 일**이다. 그 주소에서 실제 소식을 읽는 일은
#    다음 단계다 — 목록이 먼저 있어야 읽을 자리가 생긴다.
#
#    자주 돌 필요가 없다. 구청이 게시판을 새로 만들 때나 바뀐다 → **달에 한 번.**

# ⏸️ **2026-10-08: 사장님이 「구청 보류」라고 하셨다. 예약을 껐다.**
#    주소 목록(src/data/gu-rss-feeds.json)은 이미 받아 뒀다 — 버리지 않는다.
#    다시 할 때는 아래 `schedule:` 두 줄의 주석을 벗기면 된다.
#    자세한 것은 docs/할-일-대기.md.
on:
  # ▶️ **보류를 풀었다** (2026-10-10, 사장님: "구청 자료 모아").
  #    주소 목록이 바뀌는 일은 드물어 **달에 한 번**이면 넉넉하다.
  #    실제로 글을 읽는 것은 collect-gu-news.yml 이 **매일** 한다.
  schedule:
    - cron: "40 21 1 * *" # 매달 1일 06:40 KST
  workflow_dispatch:
    inputs:
      apply:
        description: "받은 목록을 저장소에 적는다 (끄면 보기만)"
        type: boolean
        required: false
        default: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    # ⏱️ 25번 부른다. 서울시 쪽이 느려지면 늘어난다 — 천장을 달아 둔다.
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 받아 오기
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          set -o pipefail
          # 예약 실행(schedule)에는 inputs 가 없다 — 그때는 적는 것이 맞다.
          if [ "$APPLY" = "false" ]; then
            node scripts/fetch-gu-rss.mjs 2>&1 | tee rss-log.txt
          else
            node scripts/fetch-gu-rss.mjs --apply 2>&1 | tee rss-log.txt
          fi
      - name: 적은 것 커밋
        if: ${{ inputs.apply != false }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 🚨 처음 생기는 파일은 `git diff` 가 못 본다 — 먼저 add 하고 --cached 로 본다
          #    (2026-10-08에 probe-gu-newsletter 가 그래서 빈손으로 초록불이 떴다).
          git add src/data/gu-rss-feeds.json docs/구청-RSS-목록.md
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 — 커밋하지 않는다."
          else
            git commit -m "구청 RSS 주소 목록 갱신 (fetch-gu-rss) [skip render]"
            git push
          fi
      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 📡 구청 RSS 주소"
            echo ""
            echo '```'
            cat rss-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
