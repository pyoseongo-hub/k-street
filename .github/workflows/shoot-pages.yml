name: Shoot pages (주소를 폰 화면으로 찍기)

# 📸 **주소 목록을 폰 크기로 찍어 눈으로 확인한다.**
#    사장님 (2026-09-16): *"모든 링크 다보고 스샷찍고 확인"*
#
#    링크 검사는 「200이 떴다」까지만 말해 준다. 200이 떠도 화면이 깨졌거나
#    빈 칸이거나 옛 내용일 수 있다. **눈으로 봐야 아는 것**이 있다.
#
# ⚠️ 작업 환경에서는 korea-street.com 이 막혀 있어 여기서 찍는다.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "찍을 주소 (쉼표로). 비우면 앱 첫 화면"
        required: false
        default: "https://korea-street.com"
      out:
        description: "어느 폴더에 담을까"
        required: false
        default: "docs/화면-확인"
      full:
        description: "페이지 전체를 찍을까 (끄면 첫 화면만)"
        type: boolean
        default: false
      apply:
        description: "저장소에 커밋할까 (끄면 Artifacts 로만)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  shoot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 🎭 playwright 는 이 저장소의 의존성이 아니다(앱에는 필요 없다).
      #    찍을 때만 받는다 — 앱 꾸러미를 무겁게 하지 않는다.
      - name: 브라우저 준비
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium

      - name: 찍기
        env:
          URLS: ${{ inputs.urls }}
          OUT: ${{ inputs.out }}
          FULL: ${{ inputs.full && '1' || '0' }}
        run: |
          set -o pipefail
          node scripts/shoot-pages.mjs 2>&1 | tee shoot-log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: kstreet-page-shots
          path: ${{ inputs.out }}/*
          if-no-files-found: error

      - name: 저장소에 커밋
        if: ${{ inputs.apply }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ inputs.out }}"
          git diff --cached --quiet && { echo "바뀐 게 없다"; exit 0; }
          git commit -m "📸 주소를 폰 화면으로 찍었다 (shoot-pages) [skip render]"
          # 🚨 **밀렸을 때 다시 해 본다** (2026-09-17에 당했다).
          # 워크플로 두 개가 겹치면 뒤에 끝난 쪽의 push 가 막힌다. 그냥 두면
          # **받아 온 자료가 통째로 버려진다** — 사진 받기가 API 를 543번 부르고
          # 3분 30초를 쓴 뒤 여기서 떨어져 전부 날아갔다.
          # 그래서 원격을 당겨 내 커밋을 그 위에 얹고(rebase) 다시 민다.
          # ⚠️ 세 번 다 밀리면 **초록불을 주지 않는다** — 조용히 넘어가면 모르고 지나간다.
          pushed=no
          for i in 1 2 3; do
            if git push; then pushed=yes; break; fi
            echo "   밀렸다 — 원격을 당겨 다시 얹는다 ($i/3)"
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || exit 1
            sleep $((i * 3))
          done
          if [ "$pushed" != yes ]; then
            echo "❌ 세 번 다 밀렸다. 받아 둔 자료가 올라가지 못했다 — 다시 돌릴 것."
            exit 1
          fi

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 📸 화면 확인"
            echo ""
            echo '```'
            tail -c 40000 shoot-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
