name: Fetch festival dates (축제 날짜 받기)

# 관광공사 축제 57곳은 **열리는 달을 하나도 모르는 상태**였다 — 처음 자료를 받을 때
# 쓴 areaBasedList2에 날짜 칸이 없어서다(2026-09-01 확인). 그래서 계절·월로 고르는
# 화면에서 통째로 사라진다.
#
# 이 워크플로는 축제 전용 창구(searchFestival2)를 불러 시작일·종료일을 받아
# src/data/festival-dates.json에 저장한다. 이름이 아니라 **contentId로 잇는다.**
#
# 사용자는 Actions 탭에서 "Run workflow" 버튼만 누르면 된다 — 이 저장소를 만드는
# 세션은 apis.data.go.kr을 직접 못 부르고, 사용자 PC에서 PowerShell로 돌리는 것보다
# 이쪽이 훨씬 덜 헷갈린다(인증키가 %를 포함해 cmd에서 깨지는 문제도 없다).

on:
  workflow_dispatch:
  # 🚨 하루 한 번 저절로 돈다 (2026-09-02 사용자 지시: "축제는 자주 서치").
  #
  # 2026-09-01 첫 실행에서 9~12월 57곳만 잡혔다 — 관광공사 축제 창구는 이미 끝난
  # 축제를 내리고 **다가올 것만** 올려 두기 때문이다. 봄 축제는 봄이 가까워져야
  # 올라온다. 그래서 한 번 돌려서는 봄·여름이 영영 비어 있다.
  # 스크립트가 파일을 덮어쓰지 않고 **보태므로**, 자주 돌수록 빨리 찬다.
  #
  # 달마다 한 번이던 것을 하루 한 번으로 올린 이유가 둘이다:
  #   ① 축제는 다른 자료와 성격이 다르다 — 시장·박물관은 자리가 그대로지만
  #      축제는 회차가 새로 올라오고 날짜가 옮겨 다닌다.
  #   ② 이제 **공식 홈페이지도 함께 받는다.** 축제마다 한 번씩 불러야 해서
  #      하루치 호출 한도를 다 먹지 않게 한 번에 40곳씩만 본다 —
  #      하루 한 번 도니 며칠이면 다 찬다.
  schedule:
    - cron: "0 20 * * *" # 매일 05:00 KST (UTC 20:00 전날)

jobs:
  fetch-festival-dates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 🔔 신선도에 손볼 것이 있으면 **이슈를 연다** — 아래 단계 주석 참고.
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch festival dates
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        # pipefail이 없으면 node가 죽어도 tee가 성공해서 이 단계가 초록색이 된다.
        # 2>&1이 없으면 오류 메시지(stderr)가 로그에 안 담겨 원인이 안 보인다.
        # 둘 다 2026-09-01 번역 워크플로에서 실제로 당한 것이다.
        run: |
          set -o pipefail
          node scripts/fetch-festival-dates.mjs 2>&1 | tee fetch-log.txt
      # 🎪 **날짜만 받고 끝내지 않는다** (2026-09-10, 사장님: "축제는 … 루틴화시켜").
      #
      #    이 워크플로는 매일 돌고 있었는데도 **이름에 2025 가 박힌 축제 11곳이
      #    1년 가까이 그대로 남아 있었다.** 여기서 날짜만 갱신하고 「이 축제가 아직
      #    열리는가」는 아무도 안 봤기 때문이다. 다른 AI 평가가 짚어 줘서 알았다 —
      #    **사람이 짚어 줘야 찾아지는 구조**였다는 뜻이라, 매일 같이 재게 한다.
      - name: 축제 신선도 재기
        if: always()
        run: |
          set -o pipefail
          npm run festival-freshness 2>&1 | tee freshness-log.txt
      # 🔔 **사람에게 닿는 고리** (2026-09-10).
      #
      #    지난 1년이 썩은 진짜 이유는 검사가 없어서가 아니라 **아무도 안 봐서**다.
      #    Actions 요약과 커밋된 파일은 사장님이 들여다보는 자리가 아니다.
      #    그래서 손볼 것이 있으면 **이슈를 연다** — 저장소 주인에게 메일이 간다.
      #    (클로드 세션에 기대지 않는다. 세션은 끝나면 사라지지만 이건 남는다.)
      #
      #    ⚠️ **매일 알리지 않는다.** 월요일에만, 그리고 **이슈 하나를 계속 고쳐 쓴다.**
      #       매일 새 이슈가 쌓이면 곧 아무도 안 본다 — 그러면 지금과 똑같아진다.
      - name: 손볼 것이 있으면 알린다 (월요일만)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          [ "$(date -u +%u)" = "1" ] || { echo "월요일이 아니라 건너뛴다"; exit 0; }
          PAST=$(grep -oE '^ *[0-9]+곳  ① ' freshness-log.txt | grep -oE '[0-9]+' | head -1 || echo 0)
          STALE=$(grep -oE '^ *[0-9]+곳  ② ' freshness-log.txt | grep -oE '[0-9]+' | head -1 || echo 0)
          echo "① $PAST 곳 · ② $STALE 곳"
          # 손볼 것이 없으면 조용히 지나간다. "이상 없음"을 매주 보내면 안 읽게 된다.
          if [ "$PAST" -eq 0 ] && [ "$STALE" -lt 20 ]; then
            echo "알릴 만한 것이 없다 — 이슈를 열지 않는다"; exit 0
          fi
          TITLE="🎪 축제 신선도 — 손볼 것이 있습니다"
          {
            echo "매주 월요일에 기계가 재서 올리는 글입니다. **이 이슈 하나를 계속 고쳐 씁니다.**"
            echo ""
            echo '```'
            head -8 freshness-log.txt
            echo '```'
            echo ""
            echo "### 이게 손님에게 무슨 뜻인가"
            echo ""
            echo "- **①** 이름에 작년 연도가 박힌 축제입니다. 화면에서는 이미 「지난 회차」로 밝히고 달별 목록에서 빼 두었지만, **자료 자체는 작년 것**입니다. 올해 회차가 관광공사에 올라왔으면 바꿔 줘야 합니다."
            echo "- **②** 이름은 멀쩡한데 **올해도 열린다고 말할 근거가 우리에게 없는** 축제입니다. 근거가 작년 보도자료뿐입니다."
            echo ""
            echo "전체 목록: [docs/축제-신선도.md](../blob/main/docs/%EC%B6%95%EC%A0%9C-%EC%8B%A0%EC%84%A0%EB%8F%84.md)"
            echo ""
            echo "_기계가 자동으로 올립니다 (fetch-festival-dates 워크플로)._"
          } > issue-body.md
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
            gh issue edit "$NUM" --body-file issue-body.md
            echo "이슈 #$NUM 을 갱신했다"
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
            echo "이슈를 새로 열었다"
          fi
      - name: Commit festival-dates.json
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 신선도 표도 같이 커밋한다 — 화면 로그는 흘러가고, **파일이 남아야
          # 다음 사람이 「무엇이 남았나」를 본다.** 이게 없어서 지난 1년을 놓쳤다.
          git add -A src/data/festival-dates.json "docs/축제-신선도.md"
          if git diff --cached --quiet; then
            echo "committed=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "축제 날짜·신선도 갱신 (fetch-festival-dates) [skip render]"
            git push
            echo "committed=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: 결과 요약 (Summary에서 바로 확인)
        if: always()
        run: |
          {
            echo "## 📅 축제 날짜 받기 결과"
            echo ""
            echo "### 🎪 축제 신선도 (여기부터 보세요)"
            echo '```'
            head -8 freshness-log.txt 2>/dev/null || echo "(못 쟀음)"
            echo '```'
            echo "자세한 목록: [docs/축제-신선도.md](../blob/main/docs/%EC%B6%95%EC%A0%9C-%EC%8B%A0%EC%84%A0%EB%8F%84.md)"
            echo ""
            if [ "${{ steps.commit.outputs.committed }}" = "yes" ]; then
              echo "### ✅ 날짜를 받아 저장했습니다"
              echo "아래 로그에서 **달별 축제 수**를 확인하세요. 12개 달에 골고루 있어야 정상입니다."
            else
              echo "### ⬜ 새로 저장된 게 없습니다"
              echo "이미 최신이거나, 인증키가 잘못됐거나, 호출이 실패했을 수 있습니다 — 아래 로그를 보세요."
            fi
            echo ""
            echo '```'
            cat fetch-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
