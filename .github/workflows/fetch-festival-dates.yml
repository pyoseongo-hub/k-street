name: Fetch festival dates (축제 날짜 받기)

# 관광공사 축제 57곳은 **열리는 달을 하나도 모르는 상태**였다 — 처음 자료를 받을 때
# 쓴 areaBasedList2에 날짜 칸이 없어서다(2026-09-01 확인). 그래서 계절·월로 고르는
# 화면에서 통째로 사라진다.
#
# 이 워크플로는 축제 전용 창구(searchFestival2)를 불러 시작일·종료일을 받아
# src/data/festival-dates.json에 저장한다. 이름이 아니라 **contentId로 잇는다.**
#
# 사용자는 Actions 탭에서 "Run workflow" 버튼만 누르면 된다 — 이 저장소를 만드는
# 세션은 apis.data.go.kr을 직접 못 부르고, 사용자 PC에서 PowerShell로 돌리는 것보다
# 이쪽이 훨씬 덜 헷갈린다(인증키가 %를 포함해 cmd에서 깨지는 문제도 없다).

on:
  workflow_dispatch:
    inputs:
      notify_now:
        # 🧪 알림은 월요일에만 도는데, 그러면 **월요일이 될 때까지 그 부분이
        #    검증 안 된 채로 남는다.** 안 돌려 본 길은 안 도는 길이다.
        #    이 스위치로 아무 날에나 한 번 확인한다.
        description: "오늘이 월요일이 아니어도 알림(이슈)을 올려 볼까요? (시험용)"
        type: boolean
        default: false
  # 🚨 하루 한 번 저절로 돈다 (2026-09-02 사용자 지시: "축제는 자주 서치").
  #
  # 2026-09-01 첫 실행에서 9~12월 57곳만 잡혔다 — 관광공사 축제 창구는 이미 끝난
  # 축제를 내리고 **다가올 것만** 올려 두기 때문이다. 봄 축제는 봄이 가까워져야
  # 올라온다. 그래서 한 번 돌려서는 봄·여름이 영영 비어 있다.
  # 스크립트가 파일을 덮어쓰지 않고 **보태므로**, 자주 돌수록 빨리 찬다.
  #
  # 달마다 한 번이던 것을 하루 한 번으로 올린 이유가 둘이다:
  #   ① 축제는 다른 자료와 성격이 다르다 — 시장·박물관은 자리가 그대로지만
  #      축제는 회차가 새로 올라오고 날짜가 옮겨 다닌다.
  #   ② 이제 **공식 홈페이지도 함께 받는다.** 축제마다 한 번씩 불러야 해서
  #      하루치 호출 한도를 다 먹지 않게 한 번에 40곳씩만 본다 —
  #      하루 한 번 도니 며칠이면 다 찬다.
  schedule:
    - cron: "0 20 * * *" # 매일 05:00 KST (UTC 20:00 전날)

jobs:
  fetch-festival-dates:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 🔔 신선도에 손볼 것이 있으면 **이슈를 연다** — 아래 단계 주석 참고.
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch festival dates
        id: fetch
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        # pipefail이 없으면 node가 죽어도 tee가 성공해서 이 단계가 초록색이 된다.
        # 2>&1이 없으면 오류 메시지(stderr)가 로그에 안 담겨 원인이 안 보인다.
        # 둘 다 2026-09-01 번역 워크플로에서 실제로 당한 것이다.
        run: |
          set -o pipefail
          node scripts/fetch-festival-dates.mjs 2>&1 | tee fetch-log.txt
      # 🎪 **날짜만 받고 끝내지 않는다** (2026-09-10, 사장님: "축제는 … 루틴화시켜").
      #
      #    이 워크플로는 매일 돌고 있었는데도 **이름에 2025 가 박힌 축제 11곳이
      #    1년 가까이 그대로 남아 있었다.** 여기서 날짜만 갱신하고 「이 축제가 아직
      #    열리는가」는 아무도 안 봤기 때문이다. 다른 AI 평가가 짚어 줘서 알았다 —
      #    **사람이 짚어 줘야 찾아지는 구조**였다는 뜻이라, 매일 같이 재게 한다.
      - name: 축제 신선도 재기
        if: always()
        run: |
          set -o pipefail
          npm run festival-freshness 2>&1 | tee freshness-log.txt
      # 🔔 **사람에게 닿는 고리** (2026-09-10).
      #
      #    지난 1년이 썩은 진짜 이유는 검사가 없어서가 아니라 **아무도 안 봐서**다.
      #    Actions 요약과 커밋된 파일은 사장님이 들여다보는 자리가 아니다.
      #    그래서 손볼 것이 있으면 **이슈를 연다** — 저장소 주인에게 메일이 간다.
      #    (클로드 세션에 기대지 않는다. 세션은 끝나면 사라지지만 이건 남는다.)
      #
      #    ⚠️ **매일 알리지 않는다.** 월요일에만, 그리고 **이슈 하나를 계속 고쳐 쓴다.**
      #       매일 새 이슈가 쌓이면 곧 아무도 안 본다 — 그러면 지금과 똑같아진다.
      - name: 손볼 것이 있으면 알린다 (월요일만)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ "$(date -u +%u)" != "1" ] && [ "${{ inputs.notify_now }}" != "true" ]; then
            echo "월요일이 아니라 건너뛴다"; exit 0
          fi
          PAST=$(grep -oE '^ *[0-9]+곳  ① ' freshness-log.txt | grep -oE '[0-9]+' | head -1 || echo 0)
          STALE=$(grep -oE '^ *[0-9]+곳  ② ' freshness-log.txt | grep -oE '[0-9]+' | head -1 || echo 0)
          echo "① $PAST 곳 · ② $STALE 곳"
          # 손볼 것이 없으면 조용히 지나간다. "이상 없음"을 매주 보내면 안 읽게 된다.
          if [ "$PAST" -eq 0 ] && [ "$STALE" -lt 20 ]; then
            echo "알릴 만한 것이 없다 — 이슈를 열지 않는다"; exit 0
          fi
          TITLE="🎪 축제 신선도 — 손볼 것이 있습니다"
          {
            echo "매주 월요일에 기계가 재서 올리는 글입니다. **이 이슈 하나를 계속 고쳐 씁니다.**"
            echo ""
            echo '```'
            # 🐞 `head -8` 이었다 — **npm·vite 빌드 잡음만 퍼 왔다.** 정작 숫자는
            #    그 아래에 있어서, 열린 이슈에 「✓ 20 modules transformed」만 적혔다.
            #    맨 앞 몇 줄이 아니라 **찾는 줄**을 집는다.
            sed -n '/🎪 축제 신선도/,/④/p' freshness-log.txt
            echo '```'
            echo ""
            echo "### 이게 손님에게 무슨 뜻인가"
            echo ""
            echo "- **①** 이름에 작년 연도가 박힌 축제입니다. 화면에서는 이미 「지난 회차」로 밝히고 달별 목록에서 빼 두었지만, **자료 자체는 작년 것**입니다. 올해 회차가 관광공사에 올라왔으면 바꿔 줘야 합니다."
            echo "- **②** 이름은 멀쩡한데 **올해도 열린다고 말할 근거가 우리에게 없는** 축제입니다. 근거가 작년 보도자료뿐입니다."
            echo ""
            echo "전체 목록: [docs/축제-신선도.md](../blob/main/docs/%EC%B6%95%EC%A0%9C-%EC%8B%A0%EC%84%A0%EB%8F%84.md)"
            echo ""
            echo "_기계가 자동으로 올립니다 (fetch-festival-dates 워크플로)._"
          } > issue-body.md
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
            gh issue edit "$NUM" --body-file issue-body.md
            echo "이슈 #$NUM 을 갱신했다"
          else
            gh issue create --title "$TITLE" --body-file issue-body.md
            echo "이슈를 새로 열었다"
          fi
      # 🆕 **화면에 없는 새 축제를 알린다** (2026-09-11, 사장님: "알림 주는걸로").
      #
      #    아래 신선도 알림과 **성격이 다르다.** 신선도는 「이미 있는 축제가 낡았다」이고
      #    이건 「관광공사에 있는데 우리 화면에는 아예 없다」다. 뒤쪽이 더 급하다 —
      #    손님이 검색해서 왔는데 그 축제가 우리 앱에 없으면 그날로 떠난다.
      #
      #    왜 저절로 안 들어가나: 앱의 축제 목록은 tour-places-raw.json 에서 오는데
      #    그 파일을 채우는 **Fetch tour places 에는 예약이 없다(손으로만 돈다).**
      #    매일 도는 이 작업은 이미 있는 축제의 날짜·홈페이지만 고친다.
      #    목록 파일을 매일 통째로 새로 받게 하지 않는 이유는, 사진·번역·좌표가 전부
      #    contentId 에 묶여 있어서 사람이 한 번 보고 들이는 편이 안전하기 때문이다.
      #
      #    ⚠️ **월요일만이 아니라 매일 본다.** 새 축제는 소식이라 엿새 늦으면 늦은 것이다.
      #       대신 **이슈 하나를 계속 고쳐 쓰고**, 다 들어오면 **기계가 닫는다** —
      #       낡은 알림이 열린 채 남으면 다음 진짜 알림도 안 읽힌다.
      #
      #    🚨 fetch 단계가 성공했을 때만 본다. 실패한 날은 로그가 반쪽이라
      #       「0곳」으로 읽히고, 그러면 **멀쩡히 열려 있던 알림을 닫아 버린다.**
      - name: 화면에 없는 새 축제가 있으면 알린다 (매일)
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # grep 파이프는 못 찾으면 **빈 값**을 돌려준다(0이 아니다). 빈 값으로
          # [ "$NEW" -eq 0 ] 을 하면 단계가 통째로 죽으므로 기본값을 먼저 박는다.
          NEW=0
          if [ -f fetch-log.txt ]; then
            N=$(sed -n 's/.*앱에 없던 새 축제 → \([0-9]*\)곳.*/\1/p' fetch-log.txt | head -1)
            [ -n "$N" ] && NEW="$N"
          fi
          echo "화면에 없는 새 축제: $NEW 곳"
          TITLE="🆕 화면에 없는 새 축제가 있습니다"
          # 🔎 **검색(--search)에 기대지 않는다.** 깃허브 검색은 색인이 늦을 때가 있어서,
          #    방금 연 이슈를 못 찾으면 다음 날 **또 연다** — 매일 도는 작업이라
          #    중복 이슈가 그대로 쌓인다. 열린 이슈를 받아 와 **제목을 글자 그대로**
          #    맞춰 보면 색인과 상관없이 확실하다.
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" || true)
          if [ "$NEW" -eq 0 ]; then
            if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
              gh issue close "$NUM" --comment "새 축제가 모두 앱에 들어왔습니다 — 기계가 닫습니다."
              echo "이슈 #$NUM 을 닫았다"
            else
              echo "새 축제 없음 — 조용히 지나간다"
            fi
            exit 0
          fi
          {
            echo "관광공사에 **우리 앱에 없는 축제 ${NEW}곳**이 올라왔습니다."
            echo "지금은 손님 화면에 **안 나옵니다.**"
            echo ""
            echo '```'
            # 맨 앞 몇 줄이 아니라 **찾는 줄**을 집는다 — 예전에 head 로 퍼 왔다가
            # 이슈에 빌드 잡음만 적힌 적이 있다.
            sed -n '/^🆕 화면에 없는 새 축제/,/^$/p' fetch-log.txt
            echo '```'
            echo ""
            echo "### 왜 저절로 안 들어가나"
            echo ""
            echo "앱이 축제 목록을 읽는 곳은 \`src/data/tour-places-raw.json\` 인데, 그 파일을 채우는 **Fetch tour places** 워크플로에는 예약이 없습니다(손으로만 돕니다). 매일 도는 이 작업은 **이미 있는 축제의 날짜·홈페이지만** 고칩니다."
            echo ""
            echo "### 넣는 법 — 한 번에 한 단계씩"
            echo ""
            echo "1. Actions → **Fetch tour places** → Run workflow → \`apply\` 를 **끈 채로** 한 번. 몇 건 늘어나는지만 봅니다."
            echo "2. 숫자가 납득되면 \`apply\` 를 켜고 다시 한 번."
            echo "3. 그 뒤 **Translate places** 를 돌려 새 축제의 12개 언어를 채웁니다."
            echo ""
            echo "⚠️ 새로 들어온 축제는 **사진·좌표·번역이 아직 비어 있습니다.** 넣고 끝이 아닙니다."
            echo ""
            echo "_기계가 매일 확인해서 올립니다 (fetch-festival-dates 워크플로). 다 들어오면 저절로 닫힙니다._"
          } > new-festivals.md
          if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
            gh issue edit "$NUM" --body-file new-festivals.md
            echo "이슈 #$NUM 을 갱신했다"
          else
            gh issue create --title "$TITLE" --body-file new-festivals.md
            echo "이슈를 새로 열었다"
          fi
      - name: Commit festival-dates.json
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 신선도 표도 같이 커밋한다 — 화면 로그는 흘러가고, **파일이 남아야
          # 다음 사람이 「무엇이 남았나」를 본다.** 이게 없어서 지난 1년을 놓쳤다.
          git add -A src/data/festival-dates.json "docs/축제-신선도.md"
          if git diff --cached --quiet; then
            echo "committed=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "축제 날짜·신선도 갱신 (fetch-festival-dates) [skip render]"
            git push
            echo "committed=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: 결과 요약 (Summary에서 바로 확인)
        if: always()
        run: |
          {
            echo "## 📅 축제 날짜 받기 결과"
            echo ""
            # 🆕 새 축제가 있으면 **맨 위에** 띄운다. 이슈도 열리지만, 요약을 열어 본
            #    사람이 스크롤을 내려야 보인다면 없는 것과 같다.
            if grep -q '^🆕 화면에 없는 새 축제' fetch-log.txt 2>/dev/null; then
              echo "### 🆕 화면에 없는 새 축제가 있습니다 — 이슈를 열어 뒀습니다"
              echo '```'
              sed -n '/^🆕 화면에 없는 새 축제/,/^$/p' fetch-log.txt
              echo '```'
              echo ""
            fi
            echo "### 🎪 축제 신선도 (여기부터 보세요)"
            echo '```'
            sed -n '/🎪 축제 신선도/,/④/p' freshness-log.txt 2>/dev/null || echo "(못 쟀음)"
            echo '```'
            echo "자세한 목록: [docs/축제-신선도.md](../blob/main/docs/%EC%B6%95%EC%A0%9C-%EC%8B%A0%EC%84%A0%EB%8F%84.md)"
            echo ""
            if [ "${{ steps.commit.outputs.committed }}" = "yes" ]; then
              echo "### ✅ 날짜를 받아 저장했습니다"
              echo "아래 로그에서 **달별 축제 수**를 확인하세요. 12개 달에 골고루 있어야 정상입니다."
            else
              echo "### ⬜ 새로 저장된 게 없습니다"
              echo "이미 최신이거나, 인증키가 잘못됐거나, 호출이 실패했을 수 있습니다 — 아래 로그를 보세요."
            fi
            echo ""
            echo '```'
            cat fetch-log.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
