name: Fetch gu festival dates (구청 축제 날짜 받기)

# 🏛️ **축제의 확정 날짜를 「해당 구청」에서 받아온다.**
#
# 사장님 지시 (2026-09-12): "관광공사 말고 해당구청봐"
#
# 왜 관광공사로는 안 되는지, 왜 25개 구청을 따로 긁지 않는지는
# scripts/fetch-gu-festival-dates.ts 맨 위에 길게 적어 뒀다. 요약만 하면 —
#   · 관광공사(searchFestival2): 우리 축제 중 **올해 확정 날짜가 올라온 것 0곳**
#   · 서울시 문화포털: 구청·구 문화재단이 **직접 올리는 자리**. 축제만 1,492건,
#     등록일이 행사 2~4주 전이라 사장님이 말한 "고지가 몇일전"이 그대로 보인다.
#
# ⚠️ 이 작업은 **기존 Fetch festival dates 를 대신하지 않는다.** 둘을 같이 둔다 —
#    관광공사에만 있는 축제가 있고 문화포털에만 있는 축제가 있다. 겹치면
#    구청 쪽(이 파일)이 이긴다. 주최자가 직접 올린 것이 더 앞선 사실이다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "받은 날짜를 저장할까요? (끄면 맛보기만 — 먼저 꺼서 돌려 볼 것)"
        type: boolean
        default: false
      notify_now:
        # 🧪 알림은 월요일에만 도는데, 그러면 **월요일이 될 때까지 그 부분이
        #    검증 안 된 채로 남는다.** 안 돌려 본 길은 안 도는 길이다.
        description: "오늘이 월요일이 아니어도 알림(이슈)을 올려 볼까요? (시험용)"
        type: boolean
        default: false
  # 하루 한 번. 구청은 확정되는 대로 올리므로 자주 볼수록 빨리 잡는다.
  # 관광공사 쪽(05:00 KST)과 한 시간 떼어 둔다 — 같은 시각에 돌면 둘이 같은 파일을
  # 밀고 당기며 푸시가 부딪친다.
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # 🚀 배포를 **손으로 깨워야** 한다 — 아래 「배포를 깨운다」 단계 주석 참고.
      actions: write
      # 🔔 주 1회 「사람이 볼 것」을 이슈로 올린다 — 아래 단계 주석 참고.
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 🔑 열쇠가 없으면 **조용히 지나간다.** 매일 빨간 X 가 뜨면 메일이 쌓이고,
      #    그러면 진짜 실패도 안 읽게 된다 — 이 저장소가 알림으로 여러 번 데인 자리다.
      - name: 인증키가 있나 본다
        id: key
        env:
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
        run: |
          if [ -z "$SEOUL_OPEN_API_KEY" ]; then
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "⏸️ SEOUL_OPEN_API_KEY 가 없어 건너뛴다."
            echo "   공짜 열쇠: https://data.seoul.go.kr → 인증키 신청 (즉시 발급)"
            echo "   받은 뒤 Settings → Secrets and variables → Actions 에 SEOUL_OPEN_API_KEY 로 넣는다."
          else
            echo "have=yes" >> "$GITHUB_OUTPUT"
            echo "🔑 인증키 ${#SEOUL_OPEN_API_KEY}자"
          fi

      # 🧪 열쇠가 없어도 **손으로 돌리면** 한 번 돌아 보기는 한다.
      #    🛑 다만 시험용 'sample' 열쇠는 **몇 번 부르면 막힌다** — 2026-09-12에
      #       80곳을 돌렸더니 전부 INFO-100(인증키가 유효하지 않습니다)이었다.
      #       그래도 열어 두는 이유는, 막히는 모습까지가 **열쇠가 필요하다는 증거**라
      #       요약 화면에서 그대로 보이기 때문이다. 「왜 안 되지」로 헤매지 않게.
      - name: 구청 축제 날짜 받기
        id: fetch
        if: steps.key.outputs.have == 'yes' || github.event_name == 'workflow_dispatch'
        env:
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
        # pipefail 이 없으면 node 가 죽어도 tee 가 성공해서 이 단계가 초록색이 된다.
        # 2>&1 이 없으면 오류가 로그에 안 담긴다. 둘 다 이 저장소가 당한 것이다.
        run: |
          set -o pipefail
          # 🚦 예약으로 도는 날은 입력 칸이 **비어 있다**(false 가 아니다).
          #    그러니 「false 면 맛보기」로 가르면 예약 실행이 맛보기가 되어
          #    **매일 돌면서 아무것도 저장하지 않는다.** 저장하는 쪽을 명시로 고른다.
          #    저장은 **열쇠가 있을 때만** — 없으면 스크립트가 스스로 막는다.
          if [ "${{ steps.key.outputs.have }}" = "yes" ] && \
             { [ "${{ inputs.apply }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; }; then
            npm run gu-festival-dates -- --apply 2>&1 | tee gu-log.txt
          else
            npm run gu-festival-dates 2>&1 | tee gu-log.txt
          fi

      - name: 저장된 것이 있으면 커밋
        id: commit
        if: steps.key.outputs.have == 'yes'
        run: |
          # 🐞 맛보기로 돌린 날은 이 파일이 **아예 없다.** 그런데 `git add <없는 파일>` 은
          #    fatal 로 죽는다 — 첫 실행이 그래서 빨갛게 끝났다. 받아 오는 일은 다 끝난
          #    뒤였는데도 사장님 화면에는 ❌ 로 보였다. **없으면 그냥 지나간다.**
          if [ ! -f src/data/gu-festival-dates.json ]; then
            echo "committed=no" >> "$GITHUB_OUTPUT"
            echo "⬜ 저장된 파일이 없다 (맛보기로 돌렸다는 뜻) — 커밋할 것이 없다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A src/data/gu-festival-dates.json
          if git diff --cached --quiet; then
            echo "committed=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "구청 축제 확정 날짜 갱신 (fetch-gu-festival-dates) [skip render]"
            git push
            echo "committed=yes" >> "$GITHUB_OUTPUT"
          fi

      # 🚀 **배포를 깨운다** (2026-09-12에 찾은 구멍).
      #
      #    🚨 깃허브는 **봇이 기본 토큰(GITHUB_TOKEN)으로 민 커밋으로는 다른 워크플로를
      #       안 띄운다.** 무한 반복을 막으려는 규칙이다. 그래서 이 작업이 매일 자료를
      #       받아 커밋해도 **배포는 한 번도 안 돌았다** — 실제로 확인했다:
      #
      #         봇이 띄운 Deploy 실행 횟수 … **0회**
      #
      #       받아 온 날짜가 저장소에는 있는데 **손님 화면에는 없었다.** 사람이 다른
      #       것을 푸시할 때 묻어 나가야 겨우 반영됐다. 아무도 안 짚으면 모를 일이다.
      #
      #    ✅ 고치는 법: 이 작업이 **배포를 직접 부른다.** workflow_dispatch 는
      #       기본 토큰으로도 부를 수 있다(위 permissions 의 actions: write).
      #    ⚠️ **커밋한 날에만 부른다.** 안 바뀐 날까지 배포하면 하루 한 번씩
      #       빌드를 태우는 셈이고, 이 앱의 초심(적은 비용으로 오래)과 어긋난다.
      - name: 바뀐 게 있으면 배포를 깨운다
        if: steps.commit.outputs.committed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy.yml --ref main
          echo "🚀 배포를 깨웠다 — 몇 분 뒤 korea-street.com 에 반영된다"

      # 🔔 **바뀐 주소를 검색엔진에 먼저 알린다** (IndexNow).
      #
      #    구청은 **행사 2~6주 전에야** 날짜를 올린다. 엔진이 제 발로 올 때까지
      #    기다리면 손님은 축제가 끝난 뒤에야 우리 페이지를 본다. 먼저 두드린다.
      #    빙이 받아 주고, **챗GPT·코파일럿의 검색 바탕이 빙**이다.
      #    (구글은 IndexNow 를 안 쓴다 — 구글 쪽은 사이트맵이 맡는다.)
      #
      #    🚨 **커밋한 날에만, 그리고 바뀐 주소가 있을 때만** 부른다. 두 겹으로 막는다 —
      #       스크립트도 바뀐 게 없으면 파일을 아예 안 만든다.
      #    ⚠️ 실패해도 **작업을 죽이지 않는다**(`|| true`). 날짜를 받아 저장하는 게
      #       본업이고 알림은 덤이다. 관광공사 쪽과 같은 방식이다(잣대를 맞춘다).
      - name: 바뀐 주소를 검색엔진에 알린다
        if: always() && steps.commit.outputs.committed == 'yes'
        run: |
          if [ ! -s changed-urls.txt ]; then
            echo "바뀐 주소가 없다 — 알리지 않는다"; exit 0
          fi
          node scripts/ping-indexnow.mjs --from-file changed-urls.txt || true

      # 🔔 **주 1회, 사람이 볼 것만 이슈로 올린다** (2026-09-12 사장님: "매일 확인 업데이트해").
      #
      #    🚨 매일 알리지 않는다. 이 저장소가 이미 배운 것이다 —
      #       「매일 새 이슈가 쌓이면 곧 아무도 안 본다. 그러면 지금과 똑같아진다.」
      #       그래서 **월요일에만**, 그리고 **이슈 하나를 계속 고쳐 쓴다.**
      #
      #    🚨 **손볼 것이 없으면 조용히 지나간다.** 「이상 없음」을 매주 보내면
      #       그 알림부터 안 읽게 되고, 진짜 알림도 같이 묻힌다.
      #       여기서 「손볼 것」은 **우리 화면에 없는 축제**뿐이다 —
      #       확정 날짜가 안 붙는 것은 구청이 안 올린 것이라 우리가 할 일이 없다.
      #
      #    🔎 깃허브 검색(--search)에 기대지 않는다. 색인이 늦으면 방금 연 이슈를
      #       못 찾아 **다음 주에 또 연다.** 제목을 글자 그대로 맞춘다.
      - name: 손볼 것이 있으면 주 1회 알린다 (월요일)
        if: always() && steps.fetch.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ "$(date -u +%u)" != "1" ] && [ "${{ inputs.notify_now }}" != "true" ]; then
            echo "월요일이 아니라 건너뛴다 (시험하려면 notify_now 를 켜고 돌린다)"; exit 0
          fi
          SURE=$(sed -n 's/^✅ 확정 날짜를 찾은 축제 \([0-9]*\)곳.*/\1/p' gu-log.txt | head -1)
          NEW=$(sed -n 's/^🆕 구청에는 있는데 우리 화면에 없는 축제 \([0-9]*\)곳.*/\1/p' gu-log.txt | head -1)
          SURE=${SURE:-0}; NEW=${NEW:-0}
          echo "확정 $SURE 곳 · 우리에게 없는 축제 $NEW 곳"
          TITLE="🎪 구청에 올라왔는데 우리 화면에 없는 축제"
          NUM=$(gh issue list --state open --limit 100 --json number,title \
                  --jq "[.[] | select(.title == \"$TITLE\")] | .[0].number // empty" || true)
          if [ "$NEW" -eq 0 ]; then
            if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
              gh issue close "$NUM" --comment "이제 없습니다 — 기계가 닫습니다."
              echo "이슈 #$NUM 을 닫았다"
            else
              echo "손볼 것이 없다 — 조용히 지나간다"
            fi
            exit 0
          fi
          {
            echo "구청·구 문화재단이 올린 축제 중 **우리 앱에 없는 것이 ${NEW}곳**입니다."
            echo "지금 확정 날짜가 붙은 우리 축제는 **${SURE}곳**입니다."
            echo ""
            echo "⚠️ 이 목록에는 **위령제·박람회·도서관 행사도 섞여 있습니다.**"
            echo "관광객이 갈 만한 것만 골라 들이면 됩니다 — 기계가 자동으로 넣지 않는 이유입니다."
            echo ""
            echo '```'
            sed -n '/^🆕 구청에는 있는데/,/^   ② /p' gu-log.txt | head -60
            echo '```'
            echo ""
            echo "### 들이는 법"
            echo ""
            echo "1. \`src/data/seed.ts\` 의 **\`FESTIVALS_ADDED\`** 배열 **맨 뒤**에 더합니다."
            echo "   🚨 위 \`FESTIVALS\` 한가운데에 끼워 넣으면 **뒤쪽 곳들의 id 가 통째로 밀려**"
            echo "   사진·좌표가 남의 것이 됩니다."
            echo "2. 영어 이름을 \`src/data/place-translations.json\` 의 \`en\` 에 넣습니다."
            echo "   안 넣으면 주소가 \`ks-54\` 같은 **번호**로 굳습니다 (한 번 배포되면 못 바꿉니다)."
            echo "3. \`npm run build && npm run place-pages\` 로 주소를 만들고, **Translate places** 를 돌립니다."
            echo ""
            echo "자세한 것: [docs/축제-날짜-구청에서-받기.md](../blob/main/docs/%EC%B6%95%EC%A0%9C-%EB%82%A0%EC%A7%9C-%EA%B5%AC%EC%B2%AD%EC%97%90%EC%84%9C-%EB%B0%9B%EA%B8%B0.md)"
            echo ""
            echo "_매주 월요일에 기계가 확인해서 올립니다. **이 이슈 하나를 계속 고쳐 씁니다.**_"
          } > gu-issue.md
          if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then
            gh issue edit "$NUM" --body-file gu-issue.md
            echo "이슈 #$NUM 을 갱신했다"
          else
            gh issue create --title "$TITLE" --body-file gu-issue.md
            echo "이슈를 새로 열었다"
          fi

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🏛️ 구청 축제 날짜 받기"
            echo ""
            if [ "${{ steps.key.outputs.have }}" != "yes" ]; then
              echo "### ⏸️ 인증키가 아직 없습니다 — 아래는 시험용 5줄짜리 맛보기입니다"
              echo ""
              echo "1. https://data.seoul.go.kr 에서 **인증키 신청** (공짜, 즉시 발급)"
              echo "2. 이 저장소 → Settings → Secrets and variables → Actions → New repository secret"
              echo "3. 이름 \`SEOUL_OPEN_API_KEY\`, 값은 받은 키"
              echo ""
              echo "넣고 나면 매일 06:00(한국 시각)에 저절로 돕니다."
              echo ""
            fi
            echo '```'
            cat gu-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
