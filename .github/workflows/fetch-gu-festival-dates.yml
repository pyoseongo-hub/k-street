name: Fetch gu festival dates (구청 축제 날짜 받기)

# 🏛️ **축제의 확정 날짜를 「해당 구청」에서 받아온다.**
#
# 사장님 지시 (2026-09-12): "관광공사 말고 해당구청봐"
#
# 왜 관광공사로는 안 되는지, 왜 25개 구청을 따로 긁지 않는지는
# scripts/fetch-gu-festival-dates.ts 맨 위에 길게 적어 뒀다. 요약만 하면 —
#   · 관광공사(searchFestival2): 우리 축제 중 **올해 확정 날짜가 올라온 것 0곳**
#   · 서울시 문화포털: 구청·구 문화재단이 **직접 올리는 자리**. 축제만 1,492건,
#     등록일이 행사 2~4주 전이라 사장님이 말한 "고지가 몇일전"이 그대로 보인다.
#
# ⚠️ 이 작업은 **기존 Fetch festival dates 를 대신하지 않는다.** 둘을 같이 둔다 —
#    관광공사에만 있는 축제가 있고 문화포털에만 있는 축제가 있다. 겹치면
#    구청 쪽(이 파일)이 이긴다. 주최자가 직접 올린 것이 더 앞선 사실이다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "받은 날짜를 저장할까요? (끄면 맛보기만 — 먼저 꺼서 돌려 볼 것)"
        type: boolean
        default: false
  # 하루 한 번. 구청은 확정되는 대로 올리므로 자주 볼수록 빨리 잡는다.
  # 관광공사 쪽(05:00 KST)과 한 시간 떼어 둔다 — 같은 시각에 돌면 둘이 같은 파일을
  # 밀고 당기며 푸시가 부딪친다.
  schedule:
    - cron: "0 21 * * *" # 매일 06:00 KST

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # 🔑 열쇠가 없으면 **조용히 지나간다.** 매일 빨간 X 가 뜨면 메일이 쌓이고,
      #    그러면 진짜 실패도 안 읽게 된다 — 이 저장소가 알림으로 여러 번 데인 자리다.
      - name: 인증키가 있나 본다
        id: key
        env:
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
        run: |
          if [ -z "$SEOUL_OPEN_API_KEY" ]; then
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "⏸️ SEOUL_OPEN_API_KEY 가 없어 건너뛴다."
            echo "   공짜 열쇠: https://data.seoul.go.kr → 인증키 신청 (즉시 발급)"
            echo "   받은 뒤 Settings → Secrets and variables → Actions 에 SEOUL_OPEN_API_KEY 로 넣는다."
          else
            echo "have=yes" >> "$GITHUB_OUTPUT"
            echo "🔑 인증키 ${#SEOUL_OPEN_API_KEY}자"
          fi

      # 🧪 열쇠가 없어도 **손으로 돌리면** 한 번 돌아 보기는 한다.
      #    🛑 다만 시험용 'sample' 열쇠는 **몇 번 부르면 막힌다** — 2026-09-12에
      #       80곳을 돌렸더니 전부 INFO-100(인증키가 유효하지 않습니다)이었다.
      #       그래도 열어 두는 이유는, 막히는 모습까지가 **열쇠가 필요하다는 증거**라
      #       요약 화면에서 그대로 보이기 때문이다. 「왜 안 되지」로 헤매지 않게.
      - name: 구청 축제 날짜 받기
        id: fetch
        if: steps.key.outputs.have == 'yes' || github.event_name == 'workflow_dispatch'
        env:
          SEOUL_OPEN_API_KEY: ${{ secrets.SEOUL_OPEN_API_KEY }}
        # pipefail 이 없으면 node 가 죽어도 tee 가 성공해서 이 단계가 초록색이 된다.
        # 2>&1 이 없으면 오류가 로그에 안 담긴다. 둘 다 이 저장소가 당한 것이다.
        run: |
          set -o pipefail
          # 🚦 예약으로 도는 날은 입력 칸이 **비어 있다**(false 가 아니다).
          #    그러니 「false 면 맛보기」로 가르면 예약 실행이 맛보기가 되어
          #    **매일 돌면서 아무것도 저장하지 않는다.** 저장하는 쪽을 명시로 고른다.
          #    저장은 **열쇠가 있을 때만** — 없으면 스크립트가 스스로 막는다.
          if [ "${{ steps.key.outputs.have }}" = "yes" ] && \
             { [ "${{ inputs.apply }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; }; then
            npm run gu-festival-dates -- --apply 2>&1 | tee gu-log.txt
          else
            npm run gu-festival-dates 2>&1 | tee gu-log.txt
          fi

      - name: 저장된 것이 있으면 커밋
        id: commit
        if: steps.key.outputs.have == 'yes'
        run: |
          # 🐞 맛보기로 돌린 날은 이 파일이 **아예 없다.** 그런데 `git add <없는 파일>` 은
          #    fatal 로 죽는다 — 첫 실행이 그래서 빨갛게 끝났다. 받아 오는 일은 다 끝난
          #    뒤였는데도 사장님 화면에는 ❌ 로 보였다. **없으면 그냥 지나간다.**
          if [ ! -f src/data/gu-festival-dates.json ]; then
            echo "committed=no" >> "$GITHUB_OUTPUT"
            echo "⬜ 저장된 파일이 없다 (맛보기로 돌렸다는 뜻) — 커밋할 것이 없다"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A src/data/gu-festival-dates.json
          if git diff --cached --quiet; then
            echo "committed=no" >> "$GITHUB_OUTPUT"
          else
            git commit -m "구청 축제 확정 날짜 갱신 (fetch-gu-festival-dates) [skip render]"
            git push
            echo "committed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🏛️ 구청 축제 날짜 받기"
            echo ""
            if [ "${{ steps.key.outputs.have }}" != "yes" ]; then
              echo "### ⏸️ 인증키가 아직 없습니다 — 아래는 시험용 5줄짜리 맛보기입니다"
              echo ""
              echo "1. https://data.seoul.go.kr 에서 **인증키 신청** (공짜, 즉시 발급)"
              echo "2. 이 저장소 → Settings → Secrets and variables → Actions → New repository secret"
              echo "3. 이름 \`SEOUL_OPEN_API_KEY\`, 값은 받은 키"
              echo ""
              echo "넣고 나면 매일 06:00(한국 시각)에 저절로 돕니다."
              echo ""
            fi
            echo '```'
            cat gu-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
