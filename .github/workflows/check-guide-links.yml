name: Check guide links (안내에 넣을 링크가 열리나)

# 🔗 안내 글에 넣을 바깥 링크를 **자료에 넣기 전에** 두드려 본다.
#    이 저장소를 만드는 세션은 바깥 인터넷이 막혀 있어 주소를 열어 볼 수가 없다.
#    러너는 열 수 있다 — 그래서 여기서 확인하고, 살아 있는 것만 안내에 넣는다.
#
# ⚠️ 아무것도 커밋하지 않는다. 보기만 한다.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 링크 확인
        run: |
          set -o pipefail
          node scripts/check-guide-links.mjs 2>&1 | tee links-log.txt
      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🔗 안내에 넣을 링크 확인"
            echo ""
            echo '```'
            cat links-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
