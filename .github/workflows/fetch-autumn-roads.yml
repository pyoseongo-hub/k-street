name: Fetch autumn roads (서울 단풍길 110선)

# 🍁 서울시가 해마다 뽑는 「서울 단풍길 110선」을 받아 온다.
#
#    왜 — 앱의 산책로 칸이 **25개 구에 하나씩 26곳**뿐이고, 가을에 어디를 걸으면
#    좋은지는 한 줄도 없다. 서울시 목록은 갈래까지 이미 나뉘어 있어
#    (산책길 43 · 공원 28 · 도심 20 · 물가 19) 그대로 테마가 된다.
#
# 🚨 **이 판은 엿보기다.** 어디서 어떤 모양으로 오는지 로그로 보고 나서
#    파싱을 짠다. 110줄을 눈으로 베끼지 않는다.
#
# ⚠️ 작업 세션(샌드박스)은 seoul.go.kr 이 막혀 있어 여기서만 돌아간다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "받은 것을 저장소에 커밋할까 (끄면 로그로만 봅니다)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 받는다
        run: |
          set -o pipefail
          node scripts/fetch-autumn-roads.mjs ${{ inputs.apply && '--apply' || '' }} 2>&1 | tee autumn-log.txt

      - name: 저장소에 커밋
        if: ${{ inputs.apply }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/autumn-roads.json
          git diff --cached --quiet && { echo "바뀐 게 없다"; exit 0; }
          git commit -m "🍁 서울 단풍길 목록을 받았다 (fetch-autumn-roads) [skip render]"
          git push

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🍁 서울 단풍길 110선 — 엿보기"
            echo ""
            echo '```'
            tail -c 300000 autumn-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
