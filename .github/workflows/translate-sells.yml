name: Translate sells (판매품목 낱말 번역)

# 🏪 시장 판매품목을 **낱말 단위**로 12개 언어로 번역한다.
#    왜 문장이 아니라 낱말인지는 scripts/translate-sells.mjs 머리말에.
#
# 🔁 **이미 번역한 낱말은 다시 안 보낸다.** 구글 무료 한도(월 50만 자)를 아낀다.
# ⚠️ apply 를 끈 채 먼저 돌려 번역을 눈으로 볼 것.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "번역을 파일로 저장하고 커밋할까 (끄면 맛보기만)"
        type: boolean
        default: false

jobs:
  translate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 열쇠가 있나 먼저 본다
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_TRANSLATE_API_KEY" ]; then
            echo "❌ GOOGLE_TRANSLATE_API_KEY 시크릿이 없다"; exit 1
          fi
          echo "✅ 열쇠 있음 (${#GOOGLE_TRANSLATE_API_KEY}자)"
      - name: 번역하기
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: |
          set -o pipefail
          node scripts/translate-sells.mjs ${{ inputs.apply && '--apply' || '' }} 2>&1 | tee sells-log.txt
      - name: 저장된 것이 있으면 커밋
        if: ${{ inputs.apply }}
        run: |
          if [ ! -f src/data/sells-words.json ]; then
            echo "저장된 파일이 없다 — 커밋할 것도 없다"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/sells-words.json
          git diff --cached --quiet && { echo "바뀐 게 없다"; exit 0; }
          git commit -m "판매품목 낱말을 12개 언어로 번역했다 (translate-sells) [skip render]"
          # 🚨 **밀렸을 때 다시 해 본다** (2026-09-17에 당했다).
          # 워크플로 두 개가 겹치면 뒤에 끝난 쪽의 push 가 막힌다. 그냥 두면
          # **받아 온 자료가 통째로 버려진다** — 사진 받기가 API 를 543번 부르고
          # 3분 30초를 쓴 뒤 여기서 떨어져 전부 날아갔다.
          # 그래서 원격을 당겨 내 커밋을 그 위에 얹고(rebase) 다시 민다.
          # ⚠️ 세 번 다 밀리면 **초록불을 주지 않는다** — 조용히 넘어가면 모르고 지나간다.
          pushed=no
          for i in 1 2 3; do
            if git push; then pushed=yes; break; fi
            echo "   밀렸다 — 원격을 당겨 다시 얹는다 ($i/3)"
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || exit 1
            sleep $((i * 3))
          done
          if [ "$pushed" != yes ]; then
            echo "❌ 세 번 다 밀렸다. 받아 둔 자료가 올라가지 못했다 — 다시 돌릴 것."
            exit 1
          fi
      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🏪 판매품목 낱말 번역"
            echo ""
            echo '```'
            cat sells-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
