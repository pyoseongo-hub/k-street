name: Search gallery (관광사진 갤러리를 낱말로 찾는다)

# 🔎 관광공사 「관광사진 갤러리」에서 **낱말로** 사진을 찾아 로그로 보여 준다.
#    아무것도 저장하지 않는다 — 무엇이 있는지 먼저 보는 자리다.
#
#    곳 이름으로 찾는 건 fetch-photo-gallery / probe-photo-gallery 가 한다.
#    여기는 「단풍」처럼 **주제 낱말**로 찾는 자리다.
#
# 🚨 찾은 사진을 바로 쓰지 않는다. 공공누리 유형이 사진마다 다르다.

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "무슨 낱말로 찾을까 (여럿이면 쉼표로 — 예: 단풍,벚꽃,설경)"
        required: true
        default: "단풍"
      area:
        description: "제목·검색어·촬영지에 이 말이 있는 것만 (예: 서울 · 비우면 안 거름)"
        required: false
        default: "서울"
      top:
        description: "몇 장을 보여 줄까"
        required: false
        default: "5"
      fetch:
        description: "한 번에 몇 장씩 받을까 (창구 한도 100)"
        required: false
        default: "100"
      pages:
        description: "몇 장까지 넘겨 볼까 (100장씩 · 다 찾으면 거기서 멈춘다)"
        required: false
        default: "40"
      survey:
        description: "🗺️ 끝까지 훑고 장소별로 묶어 본다 (앞쪽에 쏠리지 않게)"
        type: boolean
        default: true
      per_place:
        description: "한 곳에서 몇 장씩 보여 줄까 (survey 일 때)"
        required: false
        default: "1"
      measure:
        description: "📐 사진을 실제로 받아 몇 픽셀인지 잰다 (느려진다)"
        type: boolean
        default: false

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 🐞 2026-09-13 — 낱말 세 개를 **워크플로 세 개로 동시에** 돌렸더니
      #    설경·하경 둘 다 UND_ERR_CONNECT_TIMEOUT 으로 죽었다. 창구가 끊은 것이다.
      #    (Kfood·방문객통계에서도 같은 데 데였다 — 연달아 두드리면 막는다.)
      #    → 낱말이 여럿이면 **한 판 안에서 차례로**, 사이를 20초 띄워 돌린다.
      - name: 찾는다
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          set -o pipefail
          : > gallery-log.txt
          IFS=',' read -ra WORDS <<< "${{ inputs.keyword }}"
          for i in "${!WORDS[@]}"; do
            W="$(echo "${WORDS[$i]}" | xargs)"
            [ -z "$W" ] && continue
            [ "$i" -gt 0 ] && { echo "…20초 쉬었다 간다 (연달아 두드리면 창구가 막는다)" | tee -a gallery-log.txt; sleep 20; }
            { echo ""; echo "════════ 「$W」 ════════"; } | tee -a gallery-log.txt
            node scripts/search-gallery.mjs \
              --keyword "$W" \
              --area "${{ inputs.area }}" \
              --top "${{ inputs.top }}" \
              --fetch "${{ inputs.fetch }}" \
              --pages "${{ inputs.pages }}" \
              --per-place "${{ inputs.per_place }}" \
              ${{ inputs.survey && '--survey' || '' }} \
              ${{ inputs.measure && '--measure' || '' }} 2>&1 | tee -a gallery-log.txt
          done

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🔎 관광사진 갤러리 — 「${{ inputs.keyword }}」"
            echo ""
            echo '```'
            tail -c 40000 gallery-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
