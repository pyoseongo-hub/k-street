name: Make narration (릴스 나레이션 만들기)

# 🎙️ **릴스에 얹을 영어 나레이션을 만든다.**
#
# ⚠️ **작업 환경(Claude)에서는 못 만든다.** 음성 서비스가 웹소켓으로 붙는데
#    프록시가 그걸 막는다(`WSServerHandshakeError: 403`). 인증서를 고쳐도 안 풀린다.
#    러너는 인터넷이 뚫려 있으므로 **여기서 만들어 저장소에 커밋**한다.
#    사진을 받아 올 때와 같은 방식이다.
#
# 읽는 말은 `scripts/make-narration.py` 의 `SPEECH` 에 있다.
# 컷 길이는 `scripts/make-reel.py` 에서 **그대로 가져다 쓴다** — 따로 안 적는다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "만든 소리를 저장소에 커밋할까 (끄면 Artifacts 로 받아만 본다)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 🧰 무엇이 왜 필요한가
      #    · edge-tts        — 말을 소리로 바꾼다
      #    · pillow          — make-reel.py 를 import 하는 데 필요하다(컷 길이를 거기서 가져온다)
      #    · imageio-ffmpeg  — 소리 조각을 이어 붙인다
      #
      # 🚨 **러너에 ffmpeg 이 없다** (2026-09-16, 첫 판이 여기서 죽었다).
      #    있는 줄 알고 안 깔았다가 10초 만에 실패했다. pip 로 따라오는 static
      #    바이너리를 쓴다 — apt 보다 빠르고, 작업 환경에서 쓰는 것과 같은 것이라
      #    **여기서 통과하면 저기서도 통과한다.**
      #
      # ⚠️ 그리고 **확인하는 줄이 확인을 안 하고 있었다.** `ffmpeg -version | head -1`
      #    로 적었는데, 파이프를 쓰면 **앞이 실패해도 뒤(head)가 성공해서 0이 된다.**
      #    그래서 ffmpeg 이 없는데도 「준비」가 초록색으로 지나갔다.
      #    → 파이프를 떼고, 파이썬이 실제로 찾아낸 경로를 찍게 했다.
      - name: 준비
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet edge-tts pillow imageio-ffmpeg
          python -c "import imageio_ffmpeg; print('ffmpeg:', imageio_ffmpeg.get_ffmpeg_exe())"

      - name: 읽히기
        run: |
          set -o pipefail
          python scripts/make-narration.py 2>&1 | tee narration-log.txt

      # 📦 커밋을 안 켜도 들어 볼 수 있게 Artifacts 에 올린다.
      - uses: actions/upload-artifact@v4
        with:
          name: kstreet-narration
          path: docs/잠수교-릴스-음성/*
          if-no-files-found: error

      - name: 저장소에 커밋
        if: ${{ inputs.apply }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/잠수교-릴스-음성"
          git diff --cached --quiet && { echo "바뀐 게 없다"; exit 0; }
          git commit -m "🎙️ 잠수교 릴스 나레이션을 만들었다 (make-narration) [skip render]"
          # 🚨 **밀렸을 때 다시 해 본다** (2026-09-17에 당했다).
          # 워크플로 두 개가 겹치면 뒤에 끝난 쪽의 push 가 막힌다. 그냥 두면
          # **받아 온 자료가 통째로 버려진다** — 사진 받기가 API 를 543번 부르고
          # 3분 30초를 쓴 뒤 여기서 떨어져 전부 날아갔다.
          # 그래서 원격을 당겨 내 커밋을 그 위에 얹고(rebase) 다시 민다.
          # ⚠️ 세 번 다 밀리면 **초록불을 주지 않는다** — 조용히 넘어가면 모르고 지나간다.
          pushed=no
          for i in 1 2 3; do
            if git push; then pushed=yes; break; fi
            echo "   밀렸다 — 원격을 당겨 다시 얹는다 ($i/3)"
            git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || exit 1
            sleep $((i * 3))
          done
          if [ "$pushed" != yes ]; then
            echo "❌ 세 번 다 밀렸다. 받아 둔 자료가 올라가지 못했다 — 다시 돌릴 것."
            exit 1
          fi

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🎙️ 잠수교 릴스 나레이션"
            echo ""
            echo '```'
            tail -c 40000 narration-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
            echo ""
            echo "⚠️ **⚠️ 넘친다** 가 보이면 그 문장이 컷보다 길다는 뜻이다 —"
            echo "   \`scripts/make-narration.py\` 의 \`SPEECH\` 에서 그 줄을 줄여야 한다."
          } >> "$GITHUB_STEP_SUMMARY"
