name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 🧾 **워크플로 파일이 깨졌나 먼저 본다** (2026-09-16에 실제로 깨뜨렸다).
      #    `run: |` 블록 안에 1열에서 시작하는 줄을 넣으면 그 자리에서 블록이 끊겨
      #    파일 전체가 안 읽힌다. 푸시는 성공하고 아무 데도 안 빨개진다 —
      #    **다음에 그 워크플로를 돌리려 할 때** "workflow_dispatch 트리거가 없다"는
      #    엉뚱한 말만 듣게 된다. 그때는 무엇을 언제 깨뜨렸는지 찾기 어렵다.
      - run: node scripts/check-workflows.mjs
      # 🏷️ **관광공사 분류표가 실제 자료에 맞나** (2026-09-16).
      #    표에서 코드 한 줄이 빠지면 그 갈래가 통째로 사라지는데 화면엔 티가 안 난다.
      #    저장해 둔 조사 자료에만 대 보므로 관광공사를 부르지 않는다.
      - run: node scripts/check-tour-categories.mjs
      - run: npm run audit-seed
      # 🎨 **없는 색 이름을 부르고 있지 않나** (2026-09-15).
      #    `var(--muted, #6b6559)` 처럼 **정해 준 적 없는 이름**을 부르면 CSS 는
      #    오류를 안 낸다 — 예비값이 조용히 쓰인다. 그래서 짐보관 카드가
      #    **어두운 화면에서도 혼자 흰색**으로 남아 있었다.
      #    같은 사고를 2026-09-12에 찾아 **한 곳만 고치고 일곱 곳을 놓쳤다.**
      #    사람이 훑는 것으로는 안 된다 — 기계가 센다. 브라우저가 필요 없어 여기 건다.
      - run: npm run check-css-vars
      # 🔢 12개 언어의 **셈 문장**을 먼저 잰다 (2026-09-10).
      #    묶음 페이지는 문장 안에 숫자가 박혀서(「1 mercados」·「11 музей」)
      #    언어마다 단수·복수 규칙을 탄다. 그런데 지금 자료에 마침 1개짜리·11개짜리가
      #    없으면 **틀려 있어도 화면에 안 보인다** — 곳을 하나 더 넣는 순간 뜬다.
      #    그래서 자료가 아니라 검사가 그 숫자를 만들어 넣어 본다.
      #    페이지를 만들기 **전에** 도는 이유: 틀린 문장을 528장 찍기 전에 막는다.
      - run: npm run check-hub-strings
      - run: npm run build
      # 🔎 곳마다 진짜 HTML 페이지를 만든다 — 검색엔진과 AI 가 읽을 수 있는 문.
      #    이 앱은 화면을 자바스크립트로 그려서 index.html 본문이 0자다.
      #    이유와 작전은 docs/홍보-작전.md · scripts/build-place-pages.ts 참고.
      #    ⚠️ vite build 가 dist 를 지우고 다시 만드므로 **반드시 그 뒤에** 돈다.
      - run: npm run place-pages
      # 만들어 놓고 끝내지 않는다 — 얇은 페이지·겹치는 제목이 있으면 여기서 막는다.
      # 그런 걸 300장 올리면 검색에 도움이 되기는커녕 벌점을 받는다.
      - run: npm run check-place-pages
      # 🎪 **행사 구조화 자료가 구글 기준에 맞나** (2026-09-11).
      #    구글 서치 콘솔이 **메일로** 「startDate 누락 · location 누락 · 심각한 문제」를
      #    보내왔다 — 심각한 문제가 있으면 그 페이지는 검색 결과에 **아예 안 나온다.**
      #    1년 가까이 그 상태였고, **사람이 메일을 열어 봐야** 알 수 있었다.
      #    이제 배포마다 기계가 먼저 막는다(브라우저가 필요 없어 여기 걸 수 있다).
      - run: node scripts/check-event-jsonld.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
