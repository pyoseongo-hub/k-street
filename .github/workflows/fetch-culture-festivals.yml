name: Fetch culture festivals (전국 축제 받아 오기)

# 🎪 서울 밖 축제를 메우는 창구. 왜 이걸 붙였는지는 scripts/fetch-culture-festivals.mjs 머리에 있다.
# 🚦 **맛보기가 기본이다.** apply 를 켜야 저장한다 — 켜기 전에 끈 채로 먼저 본다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "저장까지 한다 (끄면 맛보기만)"
        type: boolean
        default: false
      days:
        description: "시작일부터 며칠치를 볼까"
        default: "120"
      from:
        description: "언제부터 (YYYYMMDD · 비우면 오늘). 끝난 축제까지 보려면 올해 1월로"
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 받아 온다
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          set -o pipefail
          node scripts/fetch-culture-festivals.mjs \
            --days=${{ inputs.days }} \
            ${{ inputs.from && format('--from={0}', inputs.from) || '' }} \
            ${{ inputs.apply && '--apply' || '--dry' }} 2>&1 | tee out.txt
      - name: 적은 것 커밋
        if: ${{ inputs.apply }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 🚨 처음 생기는 파일은 `git diff` 가 못 본다 — 먼저 add 하고 --cached 로 본다.
          git add src/data/culture-festivals.json
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 — 커밋하지 않는다."
          else
            git commit -m "전국 축제 받아 적기 (fetch-culture-festivals) [skip render]"
            git push
          fi

      - name: 요약에 붙인다
        if: always()
        run: |
          { echo "## 🎪 전국 축제"; echo ""; echo '```'; \
            cat out.txt 2>/dev/null || echo "(로그 없음)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
