name: Fetch culture festivals (전국 축제 받아 오기)

# 🎪 서울 밖 축제를 메우는 창구. 왜 이걸 붙였는지는 scripts/fetch-culture-festivals.mjs 머리에 있다.
# 🚦 **맛보기가 기본이다.** apply 를 켜야 저장한다 — 켜기 전에 끈 채로 먼저 본다.

on:
  # ⏰ **손으로 돌리는 검사는 결국 안 돌아간다.** 매일 저절로 받는다.
  #    (2026-09-11에 크게 데였다 — 요금 장부가 워크플로에 안 걸려 있어서
  #     9/2에서 멈춘 채 "$120"이라 말했고 실제는 $175였다.)
  #    08:10 KST. 다른 받아오기(20:40·21:20·22:10 UTC)와 겹치지 않게 뒀다 —
  #    공공데이터포털은 몰아서 두드리면 연결을 끊는다.
  schedule:
    - cron: "10 23 * * *" # 매일 08:10 KST
  workflow_dispatch:
    inputs:
      apply:
        description: "저장까지 한다 (끄면 맛보기만)"
        type: boolean
        default: false
      days:
        description: "시작일부터 며칠치를 볼까"
        default: "120"
      from:
        description: "언제부터 (YYYYMMDD · 비우면 오늘). 끝난 축제까지 보려면 올해 1월로"
        default: ""

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: 받아 온다
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          # 🗓️ **예약 실행에는 inputs 가 없다.** 그때는 저장하는 것이 맞다 —
          #    안 그러면 매일 돌면서 아무것도 안 바뀐다.
          #    올해 1월부터 받는 까닭: 「없는 것」과 「끝난 것」은 다르다.
          #    끝난 축제는 회색으로 「내년에 또 열립니다」로 보여 준다.
          APPLY: ${{ inputs.apply || github.event_name == 'schedule' }}
          FROM: ${{ inputs.from }}
          DAYS: ${{ inputs.days || '730' }}
        run: |
          set -o pipefail
          FROM_ARG="--from=${FROM:-$(date -u +%Y)0101}"
          if [ "$APPLY" = "true" ]; then MODE=--apply; else MODE=--dry; fi
          node scripts/fetch-culture-festivals.mjs --days="$DAYS" "$FROM_ARG" "$MODE" 2>&1 | tee out.txt
          if [ "$MODE" = "--apply" ]; then
            npm run culture-places 2>&1 | tee -a out.txt
          fi
      - name: 적은 것 커밋
        if: ${{ inputs.apply || github.event_name == 'schedule' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 🚨 처음 생기는 파일은 `git diff` 가 못 본다 — 먼저 add 하고 --cached 로 본다.
          git add src/data/culture-festivals.json \
                  src/data/culture-festival-spots.json \
                  src/data/culture-festival-dates.json
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 — 커밋하지 않는다."
          else
            git commit -m "전국 축제 받아 적기 (fetch-culture-festivals) [skip render]"
            git push
          fi

      - name: 요약에 붙인다
        if: always()
        run: |
          { echo "## 🎪 전국 축제"; echo ""; echo '```'; \
            cat out.txt 2>/dev/null || echo "(로그 없음)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
