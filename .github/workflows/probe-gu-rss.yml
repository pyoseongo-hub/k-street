name: Probe gu RSS (구청 RSS 다른 게시판 두드리기)

# 📡 축제 글이 올 리 없는 게시판을 읽고 있는 구(강서=입찰정보 등)를 고치려고
#    다른 RSS 주소를 **실제로 열어 본다.** 까닭은 scripts/probe-gu-rss.mjs 머리말.
#
# 🚫 아무것도 커밋하지 않는다. ✅ 가 뜬 것만 사람이 gu-rss-extra.json 에 옮겨 적는다.
# 🏠 작업 환경은 go.kr 에 못 닿는다(DNS) — 그래서 이 일은 여기서만 된다.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10 # ⏱️ 천장이 없으면 느려진 것이 안 드러난다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 두드려 본다
        id: probe
        continue-on-error: true # 🧯 끊겨도 요약은 남긴다
        # pipefail 이 없으면 node 가 죽어도 tee 가 성공해 이 단계가 초록색이 된다.
        run: |
          set -o pipefail
          node scripts/probe-gu-rss.mjs 2>&1 | tee rss.txt

      - name: 요약에 붙인다
        if: always()
        run: |
          { echo "## 📡 구청 RSS 두드리기"; echo ""; echo '```'; \
            cat rss.txt 2>/dev/null || echo "(로그 없음)"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # 🚨 **깨졌는데 초록불이면 안 본다.** 2026-10-17 첫 실행이 그랬다 —
      #    스크립트가 첫 호출에 터졌는데 `continue-on-error` 때문에 job 이 success 였다.
      #    요약을 남기려고 그 줄은 두되, 여기서 다시 빨간불을 켠다.
      - name: 두드리기가 끝까지 돌았나
        if: steps.probe.outcome != 'success'
        run: |
          echo "❌ 두드리기가 중간에 멈췄다 — 위 요약을 볼 것"
          exit 1
