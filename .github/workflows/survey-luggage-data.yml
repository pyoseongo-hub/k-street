name: Survey luggage data (짐 보관 자료가 있나)

# 🧳 짐 보관 **위치** 자료가 세상에 있는지 훑어본다.
#    이 저장소를 만드는 세션은 바깥 인터넷이 막혀 있다. 러너는 나갈 수 있다.
#
# 📄 찾은 것을 src/data/luggage-candidates.json 에 **적어서 커밋한다.**
#    로그를 보고 사람이 손으로 옮겨 적으면 상호 한 글자·주소 숫자 하나에서
#    오타가 난다. 러너가 받은 것을 그대로 남기고, **고르는 것만 사람이 한다.**
#
# ⚠️ 이 파일은 **후보 목록일 뿐**이다. 그대로 화면에 나가지 않는다 —
#    여행자용인지 월세 창고인지는 업종으로 안 갈린다(둘 다 「보관,저장」이다).
#    결과 요약은 실행 페이지 아래 **Summary** 에도 그대로 나온다.

on:
  workflow_dispatch:

# 후보 목록 파일을 저장소에 밀어 넣어야 한다
permissions:
  contents: write

jobs:
  survey:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 자료 훑기
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          set -o pipefail
          OUT_JSON=src/data/luggage-candidates.json node scripts/survey-luggage-data.mjs 2>&1 | tee survey-log.txt
      # 찾은 것을 저장소에 남긴다. **고르는 것은 사람이 한다** — 이 파일은
      # 후보 목록일 뿐 그대로 화면에 나가지 않는다.
      - name: 후보 목록 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/luggage-candidates.json
          git diff --cached --quiet && echo "바뀐 게 없다" || {
            git commit -m "짐 보관 후보 목록을 새로 받는다 (카카오 지역검색)"
            git push
          }
      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🧳 짐 보관 자료 훑기"
            echo ""
            echo '```'
            cat survey-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
