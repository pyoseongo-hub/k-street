name: Survey city (새 도시 자료 먼저 보기)

# 🔍 **새 도시를 만들기 전에 그 도시 자료가 어떻게 생겼는지 본다.**
#
# 왜 (2026-09-10, 사용자 지시: "진행 자료가 중요해. 만들기전에 … 자료받고 비교해서 만들어") —
# 지금 K-Street 은 서울 모양으로 박혀 있다('seoul' 이 20개 파일 290자리, 구 이름 25개,
# 서울 산 이름 목록). 제주에는 **구가 없고**(제주시·서귀포시), 서울에 없는 갈래
# (오름·올레길)가 있다. 코드를 먼저 만들면 자료를 코드 모양에 우겨넣게 된다.
#
# 🚨 **왜 PC 가 아니라 여기서 도나** — K-Street 은 사장님 PC 에 내려받혀 있지 않다.
#    지금까지 전부 클라우드 세션에서 만들어 GitHub 로 바로 올렸다. 그리고
#    TOUR_API_KEY 는 **이미 이 저장소의 시크릿**이라(7개 워크플로가 쓴다) 여기서
#    돌리면 사장님이 키를 다시 넣을 일도, 폴더를 찾을 일도 없다.
#
# ⚠️ 이 워크플로는 **아무것도 커밋하지 않는다.** seed.ts 도 안 건드린다.
#    받아서 세어 보고 요약만 남긴다 — 조사 단계이기 때문이다.

on:
  workflow_dispatch:
    inputs:
      city:
        description: "도시 이름 (예: 부산). 적으면 번호를 관광공사에 물어서 찾습니다 — 번호를 옮겨 적을 일이 없습니다"
        type: string
        required: false
        default: ""
      area:
        description: "지역 번호. 이름·번호 둘 다 비우면 지역 목록만 보여 줍니다"
        type: string
        required: false
        default: ""
      save:
        description: "받은 자료를 저장소에 넣습니다 (25KB 남짓). 넣어 두면 다음부터 여기서 바로 볼 수 있습니다"
        type: boolean
        required: false
        default: false

jobs:
  survey:
    runs-on: ubuntu-latest
    # save 를 켰을 때 커밋하려면 쓰기 권한이 있어야 한다. 켜지 않으면 쓰지 않는다.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 조사
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        # set -o pipefail 이 없으면 node 가 죽어도 tee 가 성공해 초록불로 끝난다.
        run: |
          set -o pipefail
          ARGS=""
          if [ -n "${{ inputs.area }}" ]; then ARGS="--area ${{ inputs.area }}"; fi
          # 🏙️ 이름을 적었으면 이름으로 찾는다. 번호와 같이 적으면 이름이 이긴다
          #    (사람이 방금 적은 쪽이 더 최근 뜻이다).
          if [ -n "${{ inputs.city }}" ]; then ARGS="--city ${{ inputs.city }}"; fi
          node scripts/survey-city.mjs $ARGS 2>&1 | tee survey-log.txt
      # 💾 **자료를 저장소에 넣는다** (2026-09-16에 넣었다).
      #    그전에는 artifact 로만 남겨서, 자료를 한 번 볼 때마다 Actions 를 다시 돌려야 했다.
      #    부산 조사만 세 번 돌렸다 — 그때마다 관광공사도 한 번씩 더 불렀다.
      #    파일이 25KB 남짓이라 넣어 두는 값이 훨씬 크다:
      #      · 갈래 규칙을 고칠 때마다 **API 를 안 부르고** 대 볼 수 있다
      #      · 나중에 "그때 자료가 뭐였나"를 git 이 기억해 준다
      #    ⚠️ 그래도 **seed.ts 는 안 건드린다.** 이건 조사 자료지 앱 자료가 아니다.
      - name: 자료를 저장소에 넣기 (save 를 켰을 때만)
        if: inputs.save
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/survey-*.json
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 — 커밋하지 않는다."
          else
            git commit \
              -m "🔍 도시 조사 자료 (${{ inputs.city || inputs.area }}) [skip render]" \
              -m "Survey city 워크플로가 관광공사에서 받아 저장한 원본이다. 앱 자료(seed.ts)가 아니라 조사 자료다 — 갈래 규칙을 정할 때 대 보는 표본이다."
            # 🚨 **밀렸을 때 다시 해 본다** (2026-09-17에 당했다).
            # 워크플로 두 개가 겹치면 뒤에 끝난 쪽의 push 가 막힌다. 그냥 두면
            # **받아 온 자료가 통째로 버려진다** — 사진 받기가 API 를 543번 부르고
            # 3분 30초를 쓴 뒤 여기서 떨어져 전부 날아갔다.
            # 그래서 원격을 당겨 내 커밋을 그 위에 얹고(rebase) 다시 민다.
            # ⚠️ 세 번 다 밀리면 **초록불을 주지 않는다** — 조용히 넘어가면 모르고 지나간다.
            pushed=no
            for i in 1 2 3; do
              if git push; then pushed=yes; break; fi
              echo "   밀렸다 — 원격을 당겨 다시 얹는다 ($i/3)"
              git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || exit 1
              sleep $((i * 3))
            done
            if [ "$pushed" != yes ]; then
              echo "❌ 세 번 다 밀렸다. 받아 둔 자료가 올라가지 못했다 — 다시 돌릴 것."
              exit 1
            fi
          fi

      - name: 받은 원본 남기기 (내려받아 볼 수 있게)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: survey-raw
          path: src/data/survey-*.json
          if-no-files-found: ignore
      - name: 결과 요약 (Summary 에서 바로 확인)
        if: always()
        run: |
          {
            echo "## 🔍 새 도시 자료 조사 (아직 앱엔 아무것도 안 넣었습니다)"
            echo ""
            echo '```'
            cat survey-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
