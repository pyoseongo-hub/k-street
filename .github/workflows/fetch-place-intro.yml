name: Fetch place intro (곳의 속사정 받기)

# 🏪 곳마다 **판매품목 · 영업시간 · 휴무 · 요금**을 관광공사에서 받아 온다.
#    왜 이게 필요한지는 scripts/fetch-place-intro.mjs 머리말에.
#
# ⚠️ **apply 를 끈 채 먼저 돌린다.** 몇 곳이 차는지 숫자를 보고 켠다.
# 🚨 「점포 별로 상이함」처럼 **손님에게 아무것도 안 알려 주는 값은 버린다.**
#    빈 칸이 소음보다 낫다.

on:
  # 🕕 **매일 아침 6시 20분(한국 시각)에 빈 곳을 채운다.**
  #
  #    왜 예약을 거나 — 관광공사는 **되다 말다 한다.** 2026-09-12에 손으로 두 번
  #    돌렸는데 한 번은 찔러보기 6/6 성공, 한 번은 **29번 시도 전부 실패**했다.
  #    같은 키, 같은 코드, 같은 날이다. **열려 있을 때 받는 수밖에 없다.**
  #
  #    이 스크립트는 **덮어쓰지 않고 합치니** 매일 조금씩 차오른다.
  #    사람이 「오늘은 열렸나」를 지키고 앉아 있을 이유가 없다.
  #    ⚠️ 12분 상한이 있어 하루에 다 못 받아도 괜찮다 — 다음 날 이어진다.
  schedule:
    - cron: "20 21 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "갈래 하나만 받을까 (market · museum · street … 비우면 전부)"
        required: false
        default: ""
      limit:
        description: "한 판에 몇 곳까지만 (0 이면 전부). **이미 받은 곳은 자동으로 건너뛴다**"
        required: false
        default: "6"
      apply:
        description: "받은 것을 파일로 저장하고 커밋할까 (끄면 맛보기만)"
        type: boolean
        default: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: 열쇠가 있나 먼저 본다
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          if [ -z "$TOUR_API_KEY" ]; then
            echo "❌ TOUR_API_KEY 시크릿이 없다"; exit 1
          fi
          echo "✅ 열쇠 있음 (${#TOUR_API_KEY}자)"

      - name: 물어볼 곳 목록을 뽑는다
        run: |
          npx vite build --ssr scripts/dump-intro-targets.ts --outDir dist-ssr
          node dist-ssr/dump-intro-targets.js

      - name: 받아 오기
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
          ONLY: ${{ inputs.only }}
          LIMIT: ${{ inputs.limit }}
          # ⏱️ 한 곳에 오래 매달리지 않는다 — 128번 물어보는 작업이라 곱하면 몇 시간이다.
          #    빨리 포기하고 다음으로 간다. 빈 곳은 **다시 돌리면 합쳐진다.**
          TRIES: "2"
          # 🐢 곳 사이 쉬는 시간(ms). 몰아치면 막는 서버일 수 있어 천천히 간다.
          GAP_MS: "600"
          MAX_MIN: "12"
        run: |
          set -o pipefail
          node scripts/fetch-place-intro.mjs ${{ (inputs.apply || github.event_name == 'schedule') && '--apply' || '' }} 2>&1 | tee intro-log.txt

      - name: 저장된 것이 있으면 커밋
        if: ${{ inputs.apply || github.event_name == 'schedule' }}
        run: |
          # 🐞 파일이 없는데 git add 하면 워크플로가 통째로 빨개진다 — 받기는 성공했는데도.
          if [ ! -f src/data/place-intro.json ]; then
            echo "저장된 파일이 없다 — 커밋할 것도 없다"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/place-intro.json
          git diff --cached --quiet && { echo "바뀐 게 없다"; exit 0; }
          git commit -m "곳의 속사정을 받았다 (fetch-place-intro) [skip render]"
          git push

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🏪 곳의 속사정"
            echo ""
            echo '```'
            tail -c 60000 intro-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
