name: Nearest station (곳마다 가까운 지하철역)

# 🚇 곳마다 **가장 가까운 지하철역**을 찾아 둔다.
#
# 사장님(2026-09-10): "가까운 지하철역 없으면 소비자가 알아야지 거긴 없구나
#                     / 대부분 지하 타니 가까운 지하철"
#
# 또타라커가 273개 역에 있으므로 역을 알면 보관함은 거의 따라온다.
# 그리고 **역이 멀면 「여긴 없구나」를 아는 것 자체가 쓸모**다 — 빈칸이 아니라 답이다.
#
# ⚠️ 여기서 아는 것은 **역과 거리**뿐이다. 그 역에 보관함이 있는지는 모른다.
#    화면에서 "있습니다"라고 말하지 않는다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "파일에 반영할까 (끄면 숫자만 본다)"
        type: boolean
        default: false
      all:
        description: "이미 아는 곳까지 **전부** 다시 받을까 (보통은 끈다 — 새로 들어온 곳만 묻는다)"
        type: boolean
        default: false
      gap_ms:
        description: "호출 사이에 몇 ms 쉴까. 🚨 카카오는 **분당 한도**가 있다 — 몰아치면 전부 400 이 온다"
        required: false
        default: "250"
      limit:
        description: "✂️ 한 판에 몇 곳까지만 (0 이면 전부). **받은 것은 합쳐지니 끊어서 여러 번 돌려도 된다**"
        required: false
        default: "10"

permissions:
  contents: write

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 좌표 모으기
        run: |
          npx vite build --ssr scripts/dump-place-coords.ts --outDir dist-ssr
          node dist-ssr/dump-place-coords.js
      # 🚨 2026-09-12: 317곳을 0.18초 간격으로 몰아쳤더니 **전부** 400 이 왔다
      #    ("API limit has been exceeded"). 바로 뒤 또타러기지 6곳은 **같은 키로**
      #    성공했다 — 다음 분이었기 때문이다. **분당 한도**다. 그래서 쉬어 간다.
      - name: 가까운 역 찾기
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          GAP_MS: ${{ inputs.gap_ms }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -o pipefail
          node scripts/find-nearest-station.mjs ${{ inputs.apply && '--apply' || '' }} ${{ inputs.all && '--all' || '' }} 2>&1 | tee station-log.txt
      # 🧳 또타러기지 6곳의 **역 좌표**. 단추를 누르면 길찾기가 떠야 하는데,
      #    좌표가 없으면 카카오·네이버는 검색 화면만 띄운다.
      #    여섯 번 부르고 끝이라 가까운 역 찾기와 같은 판에서 함께 돌린다.
      - name: 또타러기지 좌표 받기
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
        run: |
          set -o pipefail
          npx vite build --ssr src/lib/luggageFacts.ts --outDir dist-ssr
          node scripts/find-luggage-branches.mjs ${{ inputs.apply && '--apply' || '' }} 2>&1 | tee branch-log.txt
      - name: 반영한 것 커밋
        if: ${{ inputs.apply }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/nearest-station.json src/data/luggage-branches.json
          git diff --cached --quiet && echo "바뀐 게 없다" || {
            git commit -m "가까운 역·또타러기지 좌표를 새로 받는다 (카카오)"
            git push
          }
      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🚇 가까운 지하철역"
            echo ""
            echo '```'
            tail -20 station-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
