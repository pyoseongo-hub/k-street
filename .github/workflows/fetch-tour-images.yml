name: Fetch tour images

# 한국관광공사 TourAPI(KorService2)에서 축제·시장·꽃길·산책로·둘레길·박물관
# 185곳(2026-08-29 기준)의 대표 이미지 + 실제 좌표를 받아온다. fetch-coords.yml과 같은 이유로
# GitHub Actions 러너에서 돌린다 — 에이전트 샌드박스는 apis.data.go.kr을
# 못 부른다(네트워크 화이트리스트 정책), GitHub 러너는 인터넷이 자유롭다.
#
# 🔁 기본값을 "전체"로 둔다(2026-08-30) — limit 기본값이 "10"이었을 때,
#    사용자가 그 칸을 못 지우고 그대로 세 번 실행해서 매번 똑같은 10곳만
#    다시 처리했다("이번엔 새로 저장된 게 없습니다"만 반복해서 봄). 트래픽
#    한도(하루 1,000건)에 비해 185곳은 여유가 크므로, 매번 전체를 돌려도
#    문제없다 — 작게 테스트하고 싶을 때만 숫자를 직접 입력하면 된다.
#
# 🔍 **실행 결과는 이 페이지 안에서 직접 확인할 수 있다** (2026-08-29 추가) —
#    Claude가 이 저장소의 Actions 로그를 대신 열어볼 수 없어서(권한 범위 밖),
#    실행이 끝나면 Summary 칸에 "찾았는지/저장했는지"를 한글로 바로 보여준다.
#    실행 후: Actions → 이 실행(Run) 클릭 → 맨 위 Summary 부분을 보면 됨.
#    (막 실행한 페이지에서 자동으로 새로고침되며 나타난다 — 따로 찾을 필요 없음)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행에서 처리할 최대 개수 (기본값 = 빈 칸 = 전체 185곳. 테스트로 몇 개만 하려면 숫자를 입력)"
        type: string
        default: ""

jobs:
  fetch-tour-images:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch tour images
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: node scripts/fetch-tour-images.mjs --limit=${{ inputs.limit }} | tee fetch-log.txt
      - name: Commit tour-images.json
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/tour-images.json; then
            echo "committed=no" >> "$GITHUB_OUTPUT"
          else
            git add src/data/tour-images.json
            git commit -m "관광공사 사진·좌표 채우기 (fetch-tour-images) [skip render]"
            git push
            echo "committed=yes" >> "$GITHUB_OUTPUT"
          fi
      # 🚨 이 요약이 이번 세션의 핵심 개선점이다 (2026-08-29 사용자 지시:
      # "내가 다 확인 못하니 안내문구 넣어 사용자가 할수있게") — 로그를 눈으로
      # 훑어 판단하는 대신, 저장했는지/안 했는지를 한 줄로 못 박아 보여준다.
      - name: 결과 요약 (Summary에서 바로 확인)
        if: always()
        run: |
          {
            echo "## 📸 관광공사 사진·좌표 가져오기 결과"
            echo ""
            if [ "${{ steps.commit.outputs.committed }}" = "yes" ]; then
              echo "### ✅ 새로 찾은 사진·좌표를 저장했습니다"
              echo "앱에는 몇 분 뒤 자동으로 반영됩니다(배포 파이프라인이 알아서 돕니다)."
            else
              echo "### ⬜ 이번엔 새로 저장된 게 없습니다"
              echo "이미 저장된 것과 결과가 똑같거나(같은 limit으로 재실행), 이름이 일치하는 곳을 못 찾았을 때입니다."
              echo "아래 로그에서 ⬜(못 찾음)가 대부분이면, 그 장소 이름이 관광공사 자료에 다르게 등록돼 있을 가능성이 큽니다 — 정상입니다(정확도 원칙: 억지로 맞추지 않음)."
            fi
            echo ""
            echo "이번 실행 값 — limit: \`${{ inputs.limit || '(빈 칸 = 전체 185곳)' }}\`"
            echo ""
            echo "<details><summary>🪵 전체 로그 보기 (장소별 ✅/⬜/❌)</summary>"
            echo ""
            echo '```'
            cat fetch-log.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
