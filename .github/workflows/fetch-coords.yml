name: Fetch coordinates

# 좌표 없는 장소(seed.ts, 현재 147곳)에 카카오 로컬 검색 + 네이버 지오코딩으로
# 좌표를 채운다. 이 세션(에이전트 샌드박스)은 지도 API 호스트를 못 부르므로
# (네트워크 화이트리스트 정책) 실제 인터넷이 되는 GitHub Actions 러너에서 돌린다.
#
# apply=false(기본값)면 미리보기만 하고 커밋하지 않는다 — 먼저 로그로 매칭
# 결과를 확인한 뒤 apply=true로 다시 돌릴 것 (CLAUDE.md 관례: "apply를 켠 채로
# 먼저 돌려 보고 확인한 뒤 켠다"와 동일한 방식).

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "coords.json에 실제로 반영할지 (꺼두면 로그만 확인)"
        type: boolean
        default: false
      limit:
        description: "이번 실행에서 처리할 최대 개수 (빈 칸이면 전체)"
        type: string
        default: "30"

jobs:
  fetch-coords:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch coordinates
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_GEOCODE_CLIENT_ID: ${{ secrets.NAVER_GEOCODE_CLIENT_ID }}
          NAVER_GEOCODE_CLIENT_SECRET: ${{ secrets.NAVER_GEOCODE_CLIENT_SECRET }}
        run: |
          ARGS="--limit=${{ inputs.limit }}"
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          node scripts/fetch-coords.mjs $ARGS
      - name: Commit coords.json
        if: inputs.apply == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/coords.json; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git add src/data/coords.json
          git commit -m "좌표 채우기 (fetch-coords) [skip render]"
          git push
