name: Fetch coordinates

# 좌표 없는 장소(seed.ts, 현재 147곳)에 카카오 로컬 검색 + 네이버 지오코딩으로
# 좌표를 채운다. 이 세션(에이전트 샌드박스)은 지도 API 호스트를 못 부르므로
# (네트워크 화이트리스트 정책) 실제 인터넷이 되는 GitHub Actions 러너에서 돌린다.
#
# apply=false(기본값)면 미리보기만 하고 커밋하지 않는다 — 먼저 로그로 매칭
# 결과를 확인한 뒤 apply=true로 다시 돌릴 것 (CLAUDE.md 관례: "apply를 켠 채로
# 먼저 돌려 보고 확인한 뒤 켠다"와 동일한 방식).

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "coords.json에 실제로 반영할지 (꺼두면 로그만 확인)"
        type: boolean
        default: false
      limit:
        description: "이번 실행에서 처리할 최대 개수 (빈 칸이면 전체)"
        type: string
        default: "30"

jobs:
  fetch-coords:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch coordinates
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_GEOCODE_CLIENT_ID: ${{ secrets.NAVER_GEOCODE_CLIENT_ID }}
          NAVER_GEOCODE_CLIENT_SECRET: ${{ secrets.NAVER_GEOCODE_CLIENT_SECRET }}
        run: |
          ARGS="--limit=${{ inputs.limit }}"
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="$ARGS --apply"; fi
          node scripts/fetch-coords.mjs $ARGS | tee fetch-log.txt
      # inputs.apply는 boolean 타입 입력이라 실제 값은 문자열 "true"가 아니라
      # 진짜 boolean이다 — 'inputs.apply == \'true\''로 쓰면 boolean과 문자열을
      # 비교하다 항상 false가 되어 이 단계가 조용히 skipped된다(실제로 겪었다:
      # apply=true로 돌렸는데 로그엔 "coords.json에 반영함"이라 나왔지만 저장소엔
      # 전혀 커밋이 안 됐다 — 스크립트는 러너 로컬 파일만 고쳤을 뿐이었다).
      - name: Commit coords.json
        id: commit
        if: inputs.apply
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data/coords.json; then
            echo "committed=no" >> "$GITHUB_OUTPUT"
          else
            git add src/data/coords.json
            git commit -m "좌표 채우기 (fetch-coords) [skip render]"
            git push
            echo "committed=yes" >> "$GITHUB_OUTPUT"
          fi
      # 🚨 fetch-tour-images.yml과 같은 이유로 추가(2026-08-29: "내가 다 확인
      # 못하니 안내문구 넣어 사용자가 할수있게") — Claude가 이 저장소 Actions
      # 로그를 대신 못 보므로, 실행 결과를 이 페이지 Summary에서 바로 확인하게 한다.
      - name: 결과 요약 (Summary에서 바로 확인)
        if: always()
        run: |
          {
            echo "## 📍 좌표 채우기 결과"
            echo ""
            if [ "${{ inputs.apply }}" != "true" ]; then
              echo "### 👀 미리보기만 했습니다 (apply를 켜지 않음)"
              echo "저장소에는 아무것도 반영되지 않았습니다. 아래 로그를 먼저 확인하고, 괜찮으면 apply를 켜서 다시 실행하세요."
            elif [ "${{ steps.commit.outputs.committed }}" = "yes" ]; then
              echo "### ✅ 새로 찾은 좌표를 저장했습니다"
              echo "앱에는 몇 분 뒤 자동으로 반영됩니다."
            else
              echo "### ⬜ 이번엔 새로 저장된 게 없습니다"
              echo "이미 저장된 것과 결과가 같거나, 이름이 일치하는 곳을 카카오·네이버에서 못 찾았을 때입니다(정상 — 억지로 맞추지 않습니다)."
            fi
            echo ""
            echo "이번 실행 값 — limit: \`${{ inputs.limit || '(빈 칸 = 전체)' }}\`, apply: \`${{ inputs.apply }}\`"
            echo ""
            echo "<details><summary>🪵 전체 로그 보기 (장소별 ✅/⬜/❌)</summary>"
            echo ""
            echo '```'
            cat fetch-log.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
