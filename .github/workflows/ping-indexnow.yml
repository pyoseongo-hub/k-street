name: Ping IndexNow (바뀐 주소를 검색엔진에 알리기)

# 🔔 **빙·야후·네이버·얀덱스에게 "여기 봐 주세요"라고 먼저 두드린다.**
#
# 왜 (2026-09-11 사장님 계획서 6번) —
#   구글 하나에만 걸려 있는 것이 위험하다. 특히 **챗GPT·코파일럿의 검색 바탕이 빙**이라,
#   요즘 손님이 대화창에서 여행 계획을 짤 때 그 자리에 우리가 없다.
#   IndexNow 는 보내는 곳 하나면 참여한 엔진에 같이 퍼진다.
#   (구글은 IndexNow 를 안 쓴다 — 구글 쪽은 사이트맵·서치 콘솔이 맡는다.)
#
# 🚨 **날마다 돌리지 않는다.** IndexNow 는 「바뀐 주소」를 알리는 것이다.
#    안 바뀐 주소를 되풀이해 보내면 엔진이 **우리 알림을 무시하기 시작한다.**
#    · 축제 자료가 바뀐 날은 `fetch-festival-dates` 가 **바뀐 주소만** 저절로 보낸다.
#    · 이 워크플로는 **손으로** 돌리는 자리다 — 첫 등록, 또는 자료를 크게 넣은 뒤 한 번.
#
# ⚠️ 열쇠 파일 `public/8b26e48d77134bf0626ee5f7db89b435.txt` 가 배포돼 있어야 한다.
#    엔진이 그 파일을 열어 주인임을 확인한다. 지우거나 이름을 바꾸면 전부 거절당한다.
#    비밀값이 아니다 — 누구나 열어 볼 수 있어야 작동한다.

on:
  workflow_dispatch:
    inputs:
      apply:
        # 맛보기를 기본으로 둔다. 이 저장소 규칙이다 —
        # **끈 채로 먼저 돌려 무엇이 갈지 보고**, 납득한 뒤에 켠다.
        description: "실제로 보낼까요? (끄면 무엇을 보낼지만 보여 줍니다)"
        type: boolean
        default: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 🗺️ 보낼 주소는 **사이트맵에서 읽는다.** 목록을 손으로 적지 않는다 —
      #    적는 순간 페이지가 늘어도 안 늘어난 목록이 남는다.
      #    사이트맵은 빌드 때 만들어지므로 여기서 한 번 만든다.
      #    ⚠️ vite build 가 dist 를 지우므로 place-pages 가 **그 뒤에** 와야 한다.
      - run: npm run build
      - run: npm run place-pages
      - name: 보낸다
        run: |
          set -o pipefail
          if [ "${{ inputs.apply }}" = "true" ]; then
            node scripts/ping-indexnow.mjs --all 2>&1 | tee ping-log.txt
          else
            node scripts/ping-indexnow.mjs --all --dry-run 2>&1 | tee ping-log.txt
          fi
      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🔔 IndexNow 결과"
            echo ""
            if [ "${{ inputs.apply }}" = "true" ]; then
              echo "**실제로 보냈습니다.**"
            else
              echo "🧪 **맛보기입니다 — 아무것도 안 보냈습니다.** 목록이 맞으면 \`apply\` 를 켜고 다시 돌리세요."
            fi
            echo ""
            echo '```'
            cat ping-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
            echo ""
            echo "확인하는 곳: [Bing Webmaster Tools](https://www.bing.com/webmasters) → **IndexNow**"
          } >> "$GITHUB_STEP_SUMMARY"
