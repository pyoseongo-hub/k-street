name: Check domains (도메인 비었나 확인)

# 🌐 도메인이 비어 있는지 확인만 한다. 아무것도 저장하지 않는다.
#
# 왜 Actions에서 도나 — 작업 세션(에이전트 샌드박스)은 도메인 조회 서버가
# 전부 막혀 있다(rdap·whois·dns.google·도메인 주소 자체까지). 러너는 된다.
#
# 2026-09-04에 도메인을 정하다 헛걸음한 뒤 만들었다 — 전해 들은 말로
# 정하지 않고 기계가 직접 보게 한다.

on:
  workflow_dispatch:
    inputs:
      domains:
        description: "확인할 도메인 (빈 칸이면 준비된 후보 목록). 띄어쓰기나 쉼표로 여러 개"
        type: string
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 도메인 확인
        env:
          DOMAINS: ${{ inputs.domains }}
        run: |
          set -o pipefail
          node scripts/check-domains.mjs 2>&1 | tee domains-log.txt
      - name: 결과 요약 (Summary에서 바로 확인)
        if: always()
        run: |
          {
            echo "## 🌐 도메인 확인 결과"
            echo ""
            echo '```'
            cat domains-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
