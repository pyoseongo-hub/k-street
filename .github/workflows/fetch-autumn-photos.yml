name: Fetch photos (갤러리 사진을 받아 줄여 담는다)

# 🍁 인스타 「서울 가을길」 릴스에 쓸 단풍 사진 20장을 받아 **작게 줄여** 저장한다.
#
#    왜 저장소에 담나 — 작업 세션(샌드박스)은 tong.visitkorea.or.kr 이 막혀 있고
#    (connect_rejected), 아티팩트 화면도 바깥 사이트 이미지를 막는다.
#    **주소만으로는 사진이 안 보인다.** 저장소에 담아야 화면에 심을 수 있다.
#
#    덤으로 쓸모가 있다 — 단풍길 110곳 중 109곳이 사진이 없다.
#    여기 20장은 나중에 앱 쪽에서도 쓸 수 있다.
#
# 🖼️ 원본은 크다(장당 수 MB). **가로 720px · 품질 72** 로 줄여 담는다.
#    보고 고르는 용도라 그 정도면 충분하고 저장소가 무거워지지 않는다.
#    ⚠️ 영상에 실제로 쓰실 때는 **원본 주소**로 받으시는 게 맞다 —
#       줄인 것을 영상에 넣으면 화질이 떨어진다.
#
# 🧨 heredoc 을 쓰지 않는다. 처음에 `LIST=$(cat <<'EOF' …)` 로 썼다가
#    목록 줄이 YAML 블록 들여쓰기 밖으로 나가 **파일 전체가 안 읽혔다**
#    (워크플로 이름이 파일 경로로 뜨고 workflow_dispatch 가 없다고 나왔다).
#    run: | 안에서는 모든 줄이 들여쓰기 안에 있어야 한다.
#
# 저작권: 한국관광공사 관광사진 갤러리 · 공공누리 제1유형(출처표시).
#         원본 주소를 photos.json 에 함께 적어 둔다 — 출처를 잃으면 쓸 근거가 사라진다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "받은 것을 저장소에 커밋할까 (끄면 크기만 재 봅니다)"
        type: boolean
        default: false
      list:
        description: "받을 목록 — `번호:이름` 을 빈칸으로 나눠서. 비우면 아래 서울 20장(기본값)"
        required: false
        default: ""
      out:
        description: "어느 폴더에 담을까 (저장소 안 경로)"
        required: false
        default: "docs/가을길-사진"
      width:
        description: "가로 몇 px 로 줄일까. **0 이면 안 줄이고 원본 그대로** 담는다"
        required: false
        default: "720"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # ⏱️ 1판은 20분 넘게 같은 단계에 머물렀다. 기본 한도는 6시간이라
    #    걸리면 그만큼 붙들려 있는다. **뚜껑을 씌운다.**
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # 🧨 **러너에 ImageMagick 이 없다** (2026-09-14에 알았다).
      #    2판이 20장 전부 "줄이지 못했다"로 끝났는데, 로그를 보니
      #    `convert: No such file or directory` 였다. 있겠거니 하고 쓴 것이다.
      #    ⚠️ 다행히 **사진은 다 받아졌었다**(300KB~1.2MB). 버린 건 줄이기뿐이었다.
      - name: 줄이는 도구를 깐다
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          magick -version | head -1 || convert -version | head -1

      - name: 받아서 줄인다
        env:
          IN_LIST: ${{ inputs.list }}
          IN_OUT: ${{ inputs.out }}
          IN_WIDTH: ${{ inputs.width }}
        run: |
          set -uo pipefail
          OUT="${IN_OUT:-docs/가을길-사진}"
          WIDTH="${IN_WIDTH:-720}"
          mkdir -p "$OUT"

          # 번호:곳이름 — 번호가 곧 갤러리 사진 번호다(출처를 잃지 않는다).
          # 🔁 **목록을 밖에서 넣을 수 있다** (2026-09-15 사장님: "가을 등산 사진,
          #    서울 아니어도, 30장"). 비워 두면 아래 서울 20장이 그대로 쓰인다 —
          #    앞판이 받아 둔 것이라 **지우지 않고 기본값으로 남긴다.**
          LIST="2519444:덕수궁돌담길 2519442:덕수궁돌담길 1856329:덕수궁돌담길"
          LIST="$LIST 1856334:덕수궁돌담길 2643910:덕수궁"
          LIST="$LIST 4063072:종묘 4063074:종묘 1428656:종묘 1428626:종묘"
          LIST="$LIST 1857039:북촌감고당길 1857037:북촌감고당길"
          LIST="$LIST 3100576:문묘성균관 3100580:문묘성균관 1676200:성균관대학교"
          LIST="$LIST 4063082:선유도공원 4063083:선유도공원"
          LIST="$LIST 4063104:양화한강공원 4063105:양화한강공원"
          LIST="$LIST 1432177:여의도공원 1131485:고려대학교"

          # 밖에서 준 목록이 있으면 그것만 쓴다.
          if [ -n "${IN_LIST:-}" ]; then LIST="$IN_LIST"; fi
          TOTAL=$(echo $LIST | wc -w)
          echo "📥 ${TOTAL}장을 ${OUT} 에 담는다 (가로 ${WIDTH}px)"
          echo ""

          # 줄이는 도구가 7판이면 magick, 6판이면 convert 다. 있는 쪽을 쓴다.
          # 🧨 **재는 명령은 따로다** (2026-09-15에 또 19장을 날렸다).
          #    7판은 `magick identify x.jpg` 가 되지만, **6판은 `convert identify` 가 안 된다** —
          #    convert 는 "identify" 를 **입력 파일 이름**으로 알아듣고 실패한다.
          #    6판에서 재는 명령은 `identify` 라는 별도 명령이다.
          #    그래서 「멀쩡한 JPEG 인데 그림이 아니다」라는 말이 안 되는 로그가 나왔다.
          #    ⚠️ 그걸 알아챈 건 `file -b` 를 같이 찍어 뒀기 때문이다 —
          #       「JPEG image data」라고 적혀 있는데 우리가 아니라고 하고 있었다.
          #       **판정이 이상하면 판정하는 쪽을 의심한다.**
          if command -v magick >/dev/null; then IM="magick"; ID="magick identify"; else IM="convert"; ID="identify"; fi
          echo "줄이는 도구: $IM · 재는 도구: $ID"
          echo ""

          JSON="$OUT/photos.json"
          echo "[" > "$JSON"
          FIRST=1
          OKC=0
          for ITEM in $LIST; do
            NO="${ITEM%%:*}"
            NAME="${ITEM##*:}"
            TAIL="${NO: -2}"
            URL="https://tong.visitkorea.or.kr/cms2/website/${TAIL}/${NO}.jpg"
            # 🧨 **`.raw` 라는 이름으로 저장하면 안 된다** (2026-09-15에 19장을 통째로 날렸다).
            #    ImageMagick 은 **확장자를 보고 읽는 방법을 고른다.** `.raw` 는 카메라
            #    RAW(DNG) 파일이라, 멀쩡한 JPEG 를 주고도 이렇게 죽는다:
            #        convert-im6.q16: Unsupported file format or not RAW file `/tmp/4063814.raw`
            #    사진은 다 받아졌는데(261KB~408KB) 줄이는 데서 전부 실패했다.
            #    ⚠️ 앞판에서는 안 보였다 — 그때는 ImageMagick 이 아예 안 깔려 있어서
            #       「없는 명령」으로 죽었고, 그걸 고치고 나서야 이게 드러났다.
            #    → 갤러리 주소는 전부 jpg 다. **받는 파일도 .jpg 로 둔다.**
            RAW="/tmp/${NO}-원본.jpg"
            DEST="$OUT/${NO}.jpg"

            # 🕐 **어디까지 갔는지 시각과 함께 남긴다.** 1판은 20분을 돌다 멈췄는데
            #    로그에 아무것도 안 찍혀서 **어느 장에서 걸렸는지도 몰랐다.**
            #    걸릴 수 있는 일은 걸린 자리가 보이게 해 둔다.
            echo "[$(date +%H:%M:%S)] ▶ ${NO} (${NAME}) 받는다"

            # 🚨 못 받은 것을 "없는 것"으로 뭉개지 않는다 — 그 줄만 ⬜ 로 남기고 넘어간다.
            if ! curl -fsS --max-time 20 --connect-timeout 8 -A "Mozilla/5.0" -o "$RAW" "$URL"; then
              echo "⬜ ${NO} (${NAME}) — 못 받았다"
              continue
            fi
            BEFORE=$(stat -c%s "$RAW")

            # ⏱️ 줄이는 데도 뚜껑을 씌운다. 원본이 아주 크면 ImageMagick 이
            #    한참을 붙들고 있을 수 있는데, 거기엔 시간 제한이 없다.
            # 👀 **줄이기 전에 진짜 그림인지 본다.** 404 페이지(HTML)를 받아 놓고
            #    「사진」이라고 세는 일이 없게 한다.
            if ! $ID "$RAW" >/dev/null 2>&1; then
              echo "⬜ ${NO} (${NAME}) — 그림이 아니다 (${BEFORE} bytes · $(file -b "$RAW" | head -c 60))"
              rm -f "$RAW"
              continue
            fi
            # 0 이면 **안 줄인다.** 영상에 쓸 것은 원본이 맞다 (2026-09-15 사장님:
            # *"릴스에 넣을 사진이니 니가 받아도 될 거 같은데"*).
            # ⚠️ 줄이는 것과 **다시 저장하는 것**은 다르다. 품질을 78로 다시 저장하면
            #    크기만 비슷하고 화질은 한 번 더 깎인다. 그래서 **그대로 복사**한다.
            if [ "$WIDTH" = "0" ]; then
              cp "$RAW" "$DEST"
            elif ! timeout 45 $IM "$RAW" -resize "${WIDTH}x" -quality 78 "$DEST"; then
              echo "⬜ ${NO} (${NAME}) — 줄이지 못했다 (${BEFORE} bytes)"
              rm -f "$DEST"
              continue
            fi
            AFTER=$(stat -c%s "$DEST")
            DIM=$($ID -format "%wx%h" "$DEST" 2>/dev/null || echo "?")
            printf "✅ %s (%s)  %sKB → %sKB  %s\n" "$NO" "$NAME" \
              "$((BEFORE/1024))" "$((AFTER/1024))" "$DIM"

            if [ $FIRST -eq 0 ]; then printf ",\n" >> "$JSON"; fi
            FIRST=0
            printf '  {"번호":"%s","곳":"%s","파일":"%s.jpg","원본":"%s"}' \
              "$NO" "$NAME" "$NO" "$URL" >> "$JSON"
            OKC=$((OKC+1))
            sleep 0.4
          done
          printf "\n]\n" >> "$JSON"

          echo ""
          echo "받은 것 ${OKC} / ${TOTAL}장"
          du -sh "$OUT"

          # 🧨 한 장도 못 받았으면 빈 채로 커밋하지 않는다.
          #    오늘 봄꽃길에서 0곳짜리 파일을 커밋하고 초록불을 받았다.
          if [ "$OKC" -eq 0 ]; then
            echo "❌ 한 장도 못 받았다 — 저장하지 않는다."
            echo "   ⚠️ '사진이 없다'가 아니라 '못 물어봤다'일 수 있다."
            exit 1
          fi

      - name: 저장소에 커밋
        if: ${{ inputs.apply }}
        env:
          IN_OUT: ${{ inputs.out }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${IN_OUT:-docs/가을길-사진}"
          git diff --cached --quiet && { echo "바뀐 게 없다"; exit 0; }
          git commit -m "🍁 사진을 받아 줄여 담았다 (${IN_OUT:-docs/가을길-사진}) [skip render]"
          git push
