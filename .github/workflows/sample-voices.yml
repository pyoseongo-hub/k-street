name: Sample voices (목소리 샘플 만들기)

# 🎙️ 같은 문장을 여러 목소리로 읽혀 docs/목소리-샘플/ 에 mp3 로 넣는다.
#    작업 환경에서는 음성 서비스(웹소켓)가 막혀 러너에서 만든다 — scripts/sample-voices.py 머리말.

on:
  workflow_dispatch:
    inputs:
      text:
        description: "읽힐 문장 (비우면 스크립트의 기본 문장)"
        required: false
        default: ""
      voices:
        description: "목소리 이름들 (쉼표로. 비우면 스크립트의 후보 10개 전부)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet --upgrade pip edge-tts

      - name: 만들기
        run: |
          set -o pipefail
          ARGS=()
          [ -n "${{ inputs.text }}" ] && ARGS+=(--text "${{ inputs.text }}")
          [ -n "${{ inputs.voices }}" ] && ARGS+=(--voices "${{ inputs.voices }}")
          python scripts/sample-voices.py "${ARGS[@]}" 2>&1 | tee sample-log.txt
          echo "## 🎙️ 목소리 샘플" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(✅|❌)' sample-log.txt >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: docs/목소리-샘플/
          if-no-files-found: error

      - name: 저장소에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "docs/목소리-샘플"
          git diff --cached --quiet && { echo "바뀐 게 없다"; exit 0; }
          git commit -m "🎙️ 목소리 샘플을 만들었다 (sample-voices) [skip render]"
          pushed=no
          for i in 1 2 3; do
            if git push; then pushed=yes; break; fi
            git pull --rebase
          done
          [ "$pushed" = yes ] || { echo "❌ 세 번 밀렸다"; exit 1; }
