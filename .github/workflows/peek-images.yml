name: Peek images (사진을 눈으로 확인하기)

# 👀 **사진이 진짜 그 곳을 찍은 것인지 사람이 보려고** 받아 온다 (2026-11-04).
#    사장님: 「폭포 사진 없어」 — 홍제천인공폭포의 관광공사 사진 11장이 폭포를 찍었는지
#    작업 세션에서 확인할 길이 없었다. 작업 세션은 tong.visitkorea.or.kr 이 막혀 있다(프록시 403).
#
# 📦 받은 그림은 **`peek` 갈래에만** 올린다 — main 에 안 섞이고, 배포도 안 깨운다.
#    작업 세션에서 `git fetch origin peek` 으로 가져가 열어 본다.

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "그림 주소 (빈칸으로 나눈다). 갤러리를 낱말로 찾을 때는 비운다"
        required: false
        default: ""
      keyword:
        description: "관광사진 갤러리를 이 낱말로 찾아 받는다 (예: 벚꽃). 주소를 줬으면 비운다"
        required: false
        default: ""
      tag:
        description: "폴더 이름 (예: 3452906)"
        required: true

permissions:
  contents: write

jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5 # ⏱️ 천장이 없으면 멈췄을 때 요금이 붙는다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 받는다
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          # 갤러리 검색 스크립트는 main 에 있다 — peek 갈래로 옮기기 전에 꺼내 둔다.
          cp scripts/gallery-peek.mjs /tmp/gallery-peek.mjs
          git fetch origin peek && git checkout peek || git checkout --orphan peek
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name peek -exec rm -rf {} +
          mkdir -p "peek/${{ inputs.tag }}"
          if [ -n "${{ inputs.keyword }}" ]; then
            node /tmp/gallery-peek.mjs --keyword "${{ inputs.keyword }}" --tag "${{ inputs.tag }}" --rows 40
          fi
          n=0
          for u in ${{ inputs.urls }}; do
            n=$((n+1))
            f="peek/${{ inputs.tag }}/$(printf '%02d' $n)-$(basename "$u")"
            if curl -fsSL -m 30 -o "$f" "$u"; then echo "✅ $n $u ($(stat -c %s "$f") 바이트)"; else echo "❌ $n $u"; rm -f "$f"; fi
          done
      - name: 올린다
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add peek
          if git diff --cached --quiet; then echo "🔕 바뀐 것이 없다"; exit 0; fi
          git commit -m "사진 확인용 (peek ${{ inputs.tag }}) [skip ci]"
          git push origin peek
