name: Check district registry (명부의 시·군·구가 관광공사와 맞나)

# 🗺️ **행정구역은 바뀐다. 우리 명부는 안 바뀐다.**
#
# 2026-10-05에 인천을 열다 걸렸다 — 관광공사 주소가 **영종구·제물포구·서해구·검단구**
# 인데 cities.ts 에는 **중구·동구·서구**로 적혀 있었다. 그 바람에 빌더가
# **114곳 중 73곳을 「명부에 없는 동네」로 버렸다.** 차이나타운·월미도 자리다.
#
# 🚨 **화면은 안 깨진다.** 그 구가 없는 채로 앱이 멀쩡히 돈다 — 벌집에 칸이 없으니
#    빈 곳으로도 안 보인다. 그래서 **기계가 때맞춰 묻게** 해 둔다.
#
# ⚠️ 고치지는 않는다. 알려만 준다 — 이름을 기계가 덮어쓰면 벌집 배치와 번역된
#    이름의 열쇠가 어긋난다. 사람이 보고 cities.ts 를 고친다.

on:
  schedule:
    # 다달이 1일 아침 8:41 (KST) = 전날 23:41 UTC. 정각을 피한다.
    - cron: "41 23 1 * *"
  workflow_dispatch:
    inputs:
      all:
        description: "아직 안 연 도시(빈칸)까지 볼까요 — 새 도시를 열기 전에 켜세요"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15   # ⏱️ 천장이 없으면 관광공사가 막혔을 때 몇 시간이고 긴다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 관광공사에 물어 대조한다
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          # ⚠️ `... | tee` 뒤의 종료코드는 tee 것(늘 0)이다 — pipefail 이 없으면
          #    안 맞는 게 있어도 초록으로 지나간다. 이 저장소가 두 번 데인 자리다.
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.all }}" = "true" ]; then ARGS="--all"; fi
          node scripts/check-district-registry.mjs $ARGS 2>&1 | tee registry.txt

      - name: 결과를 요약 화면에 붙이기
        if: always()
        run: |
          {
            echo "## 🗺️ 명부 대조"
            echo '```'
            cat registry.txt || echo "(기록이 없다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
