name: Fetch tour names (관광공사 공식 다국어 이름)

# 🪪 구글 번역이 한자권에서 고유명사를 망가뜨린다(북한산 → 北朝鮮山).
#    관광공사는 같은 자료를 언어별로 따로 내는데, 그 이름은 **공식 표기**다.
#
# 🔑 이어 붙이는 열쇠는 번호가 아니라 **괄호 안 한국어**다 —
#    「アホプ山森（아홉산숲）」처럼 한국어 원문이 이름 안에 들어 있다.
#    비슷한 걸 찾는 게 아니라 **글자가 똑같은지만** 본다.
#
# apply 를 끈 채로 먼저 돌려 몇 개가 맞는지 보고, 그다음에 켠다.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "실제로 저장할까요? (끄면 몇 개가 맞는지만 보여줍니다)"
        type: boolean
        default: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 받는다
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: |
          set -o pipefail
          ARGS=""
          if [ "${{ inputs.apply }}" = "true" ]; then ARGS="--apply"; fi
          node scripts/fetch-tour-names.mjs $ARGS 2>&1 | tee names-log.txt

      - name: 저장소에 넣기 (apply 를 켰을 때만)
        if: inputs.apply
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/tour-official-names.json
          if git diff --cached --quiet; then
            echo "바뀐 것이 없다 — 커밋하지 않는다."
          else
            git commit \
              -m "🪪 관광공사 공식 다국어 이름 [skip render]" \
              -m "괄호 안 한국어로 우리 자료와 글자가 똑같은 것만 담았다. 비슷한 것은 안 본다."
            # 🚨 **밀렸을 때 다시 해 본다** (2026-09-17에 당했다).
            # 워크플로 두 개가 겹치면 뒤에 끝난 쪽의 push 가 막힌다. 그냥 두면
            # **받아 온 자료가 통째로 버려진다** — 사진 받기가 API 를 543번 부르고
            # 3분 30초를 쓴 뒤 여기서 떨어져 전부 날아갔다.
            # 그래서 원격을 당겨 내 커밋을 그 위에 얹고(rebase) 다시 민다.
            # ⚠️ 세 번 다 밀리면 **초록불을 주지 않는다** — 조용히 넘어가면 모르고 지나간다.
            pushed=no
            for i in 1 2 3; do
              if git push; then pushed=yes; break; fi
              echo "   밀렸다 — 원격을 당겨 다시 얹는다 ($i/3)"
              git pull --rebase origin "$(git rev-parse --abbrev-ref HEAD)" || exit 1
              sleep $((i * 3))
            done
            if [ "$pushed" != yes ]; then
              echo "❌ 세 번 다 밀렸다. 받아 둔 자료가 올라가지 못했다 — 다시 돌릴 것."
              exit 1
            fi
          fi

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🪪 관광공사 공식 다국어 이름"
            echo ""
            echo '```'
            cat names-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
