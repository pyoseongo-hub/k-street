name: Find creators (작은 여행 채널 찾기)

# 🔎 **한국 여행을 찍는 「작은」 유튜브 채널을 찾는다.**
#    사장님 (2026-09-16): *"아직 초보 구독자 작은 체널"* · *"다 돌려 영어권까지"*
#
#    큰 채널은 메일을 안 읽는다. 구독자 1천~2만 쯤이 본인이 직접 읽고 답장도 한다.
#    우리는 돈을 안 준다(수익화 전) — 그러니 **읽히는 것**이 전부다.
#
# ⚠️ **아무것도 커밋하지 않는다.** 찾아 보여 주기만 한다.
#    여기 나온 것을 그대로 보내지 않는다 — 채널을 열어 보고 사람이 정한다.
#
# 💰 할당량: search.list 가 검색어당 100단위, 하루 10,000단위가 기본이다.
#    검색어 10개면 1,000단위 — 하루 열 번 돌려도 남는다.

on:
  workflow_dispatch:
    inputs:
      keywords:
        description: "검색어 (쉼표로). 비우면 일본·중화권·영어권·태국·베트남 10개"
        required: false
        default: ""
      min_subs:
        description: "구독자 몇 명 이상 (너무 작으면 영향이 없다)"
        required: false
        default: "500"
      max_subs:
        description: "구독자 몇 명 이하 (넘으면 메일을 안 읽는다)"
        required: false
        default: "20000"
      days:
        description: "최근 며칠 안에 올린 영상만 (죽은 채널을 거른다)"
        required: false
        default: "120"

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 찾는다
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          # 🌏 비우면 이 열 개로 돈다. 일본 3 · 중화권 2 · 영어권 3 · 태국 1 · 베트남 1.
          #    영어권을 넣은 이유는 사장님 말씀대로 **밑져야 본전**이라서다 —
          #    search 한 번이 100단위고 하루 10,000단위다. 안 써서 남기는 게 더 아깝다.
          KEYWORDS: ${{ inputs.keywords || '韓国旅行 vlog,ソウル 旅行,ソウル グルメ,首爾 自由行,韓國 旅遊 vlog,Seoul travel vlog,Korea travel vlog,Seoul food tour,เที่ยวเกาหลี โซล,du lịch Hàn Quốc Seoul' }}
          MIN_SUBS: ${{ inputs.min_subs }}
          MAX_SUBS: ${{ inputs.max_subs }}
          DAYS: ${{ inputs.days }}
        run: |
          set -o pipefail
          node scripts/find-creators.mjs 2>&1 | tee creators-log.txt

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "## 🔎 작은 여행 채널"
            echo ""
            echo '```'
            tail -c 40000 creators-log.txt 2>/dev/null || echo "(로그 없음)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
